<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f4f8; --card:#fff; --ink:#18161f; --muted:#6c6878; --line:#e6e3ec;
  --brand1:#6b2fd6; --brand2:#f5c518; --accent:#6b2fd6; --ok:#1f9d55; --warn:#d99a00; --bad:#d6334a;
  --r:14px; --sh:0 1px 2px rgba(20,10,40,.06),0 4px 14px rgba(20,10,40,.05);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.hidden{display:none!important}
header.top{position:sticky;top:0;z-index:20;background:#000;color:#fff;display:flex;align-items:center;gap:10px;
  padding:calc(env(safe-area-inset-top) + 10px) 14px 10px}
.logo{height:38px;width:auto;display:block}
.pill{background:#000;color:#fff;border:1px solid #333;border-radius:999px;padding:4px 12px;font-weight:700;letter-spacing:.5px}
.grad{height:3px;background:linear-gradient(90deg,var(--brand1),var(--brand2))}
header .ttl{font-weight:600;opacity:.9}
header .sp{flex:1}
header .usr{font-size:13px;opacity:.8;cursor:pointer}
.dolar{white-space:nowrap;font-size:13px;background:#222;border-radius:8px;padding:3px 8px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:14px 12px 96px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:20;background:#fff;border-top:1px solid var(--line);
  display:flex;justify-content:space-around;padding:6px 4px calc(env(safe-area-inset-bottom) + 6px)}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);font-size:11px;padding:4px 2px;border-radius:10px}
nav.tabs a .ic{display:block;font-size:20px;line-height:1.1}
nav.tabs a.on{color:var(--accent);font-weight:600;background:#f1ebfd}
@media(max-width:520px){.dfe{display:none}}
@media(min-width:900px){
  nav.tabs{top:62px;bottom:0;right:auto;width:190px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding:12px 8px}
  nav.tabs a{text-align:left;font-size:14px;padding:9px 12px;display:flex;gap:10px;align-items:center;flex:none}
  nav.tabs a .ic{display:inline;font-size:17px}
  main{margin-left:200px;padding-bottom:30px}
}
h1{font-size:22px;margin:4px 0 12px}
h2{font-size:17px;margin:18px 0 8px}
h3{font-size:15px;margin:12px 0 6px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:14px;margin-bottom:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.row>*{flex:1 1 150px}
.grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(160px,1fr))}
label.f{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#fff}
input:focus,select:focus,textarea:focus{outline:2px solid #d9c8fb;border-color:var(--accent)}
input[readonly]{background:#f6f5f9}
.btn{border:0;border-radius:10px;padding:10px 14px;background:var(--accent);color:#fff;font-weight:600;cursor:pointer;white-space:nowrap}
.btn.sec{background:#efeaf8;color:var(--accent)}
.btn.ghost{background:transparent;color:var(--accent);padding:6px 8px}
.btn.bad{background:var(--bad)}
.btn.ok{background:var(--ok)}
.btn.sm{padding:6px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.kpi{background:var(--card);border-radius:var(--r);box-shadow:var(--sh);padding:12px}
.kpi .v{font-size:22px;font-weight:700}
.kpi .l{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:left;font-weight:600;color:var(--muted);font-size:12px;border-bottom:1px solid var(--line);padding:6px;white-space:nowrap;position:sticky;top:0;background:#fff}
td{border-bottom:1px solid #f0eef4;padding:7px 6px;vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}
tr.click:hover td{background:#faf8fe}
.tw{overflow:auto;max-height:70vh;border-radius:10px}
.badge{display:inline-block;border-radius:999px;padding:2px 8px;font-size:11.5px;font-weight:600;white-space:nowrap}
.b-ok{background:#e3f6ea;color:#11743c}.b-warn{background:#fff3cf;color:#8a6200}.b-bad{background:#fde4e8;color:#a3192f}
.b-info{background:#ece5fb;color:#5222ac}.b-gray{background:#eeedf2;color:#555}
.muted{color:var(--muted)} .small{font-size:12.5px}
.seg{display:flex;background:#ece9f2;border-radius:10px;padding:3px;gap:3px;flex-wrap:wrap}
.seg button{flex:1;border:0;background:transparent;border-radius:8px;padding:7px 10px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.bar .grow{flex:1 1 200px}
.modal-bg{position:fixed;inset:0;background:rgba(20,10,40,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal{background:#fff;width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
@media(min-width:760px){.modal-bg{align-items:center}.modal{border-radius:18px}}
.modal h2{margin-top:0}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.list .it{padding:10px 6px;border-bottom:1px solid #f0eef4;cursor:pointer;display:flex;gap:8px;align-items:center}
.list .it:hover{background:#faf8fe}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:#18161f;color:#fff;padding:10px 16px;border-radius:12px;z-index:90;font-size:14px;max-width:90vw}
.toast.err{background:var(--bad)}
.tot{display:flex;justify-content:space-between;padding:4px 0;border-bottom:1px dashed var(--line)}
.tot b{font-variant-numeric:tabular-nums}
.big{font-size:20px;font-weight:700}
.alert{border-left:4px solid var(--warn);background:#fffaf0;padding:10px 12px;border-radius:8px;margin-bottom:10px;font-size:14px}
.alert.bad{border-color:var(--bad);background:#fff5f6}
.alert.info{border-color:var(--accent);background:#f7f3ff}
.ln input{padding:7px 8px}
.login{max-width:380px;margin:8vh auto}
.chartbox{position:relative;height:280px}
.right{text-align:right}
.nowrap{white-space:nowrap}
@media print{
  header.top,nav.tabs,.noprint,.bar .btn,.seg{display:none!important}
  main{margin:0;padding:0;max-width:none}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .tw{max-height:none;overflow:visible}
  body{background:#fff;font-size:11px}
  .printhead{display:block!important}
}
.printhead{display:none;margin-bottom:8px}
#printHead{display:none}
@media print{
  #printHead{display:block;margin-bottom:10px}
  .grad{display:none!important}
  #printHead .ph-band{display:flex;align-items:center;gap:18px;background:#fff;color:#000;padding:10px 14px;border:1.5px solid #333;border-radius:8px}
  #printHead img{height:56px}
  #printHead .ph-t{font-size:16px;font-weight:700}
  #printHead .ph-s{font-size:11px;opacity:.85}
  #printHead .ph-f{margin-top:6px;font-size:11px;border:1px solid #ccc;border-radius:6px;padding:6px 8px}
  .bar,.noprint,.seg{display:none!important}
  canvas{max-width:100%!important}
}
.dash{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:900px){.dash{grid-template-columns:1fr 1fr}.dash .full{grid-column:1/-1}}
.dash .card{margin:0}
.dash h2{margin:0 0 8px;font-size:15px}
.hero{display:flex;align-items:center;gap:16px;background:#000;color:#fff;border-radius:var(--r);padding:14px 18px;margin-bottom:12px}
.hero img{height:70px}
.hero .t{font-size:20px;font-weight:700}.hero .s{opacity:.75;font-size:13px}
.barra{display:flex;align-items:center;gap:8px;margin:5px 0;font-size:13px}
.barra .nm{flex:0 0 46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barra .bg{flex:1;background:#efeaf8;border-radius:6px;height:16px;position:relative}
.barra .fg{background:linear-gradient(90deg,var(--brand1),#c44fd0);border-radius:6px;height:16px}
.barra .v{flex:0 0 74px;text-align:right;font-variant-numeric:tabular-nums}
.minitw{max-height:320px;overflow:auto}
@media(max-width:600px){.hm{display:none}}
</style>

<body>
<header class="top">
  <img src="logo.png" alt="Üxell Pinturas" class="logo"><span class="ttl">Costos</span>
  <span class="sp"></span>
  <span class="dolar hidden" id="hdrDolar" title="Dólar oficial BNA"></span>
  <span class="usr hidden" id="hdrUser"></span>
</header>
<div class="grad"></div>
<nav class="tabs hidden" id="nav"></nav>
<div id="printHead"></div>
<main id="app"></main>
<div id="modalRoot"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
// =====================================================================
//  CONFIGURACIÓN — completar con los datos del proyecto Supabase de Uxell
// =====================================================================
const SUPABASE_URL = 'https://rgvahqfdybonjwroqwsp.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_JgkZSgclP3J2m1Twoaf-oQ_FBGtJvo7';
// =====================================================================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
const S = { user:null, perfil:null, items:[], itemById:{}, prov:[], val:{}, bases:[], baseById:{}, dolar:null, dolarFecha:null };
const $ = (s, el=document) => el.querySelector(s);
const $$ = (s, el=document) => [...el.querySelectorAll(s)];
const esc = s => s==null ? '' : String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const hoy = () => new Date(Date.now() - new Date().getTimezoneOffset()*60000).toISOString().slice(0,10);
const mesActual = () => hoy().slice(0,7);
const nf = (v, d=2) => v==null || isNaN(v) ? '—' : Number(v).toLocaleString('es-AR', {minimumFractionDigits:d, maximumFractionDigits:d});
const usd = (v, d=3) => v==null || isNaN(v) ? '—' : 'U$S ' + nf(v, d);
const ars = (v, d=2) => v==null || isNaN(v) ? '—' : '$ ' + nf(v, d);
const fd = s => s ? s.slice(8,10) + '/' + s.slice(5,7) + '/' + s.slice(0,4) : '—';
const num = v => { if (v===''||v==null) return null; const n = Number(String(v).replace(',', '.')); return isNaN(n) ? null : n; };
const norm = c => String(c ?? '').toUpperCase().replace(/\.0$/,'').replace(/[\s\-_]+/g,'');
const can = p => S.perfil && S.perfil.activo && (S.perfil.es_admin || S.perfil['p_'+p]);
const isAdmin = () => S.perfil && S.perfil.es_admin;

function toast(msg, err=false){
  const t = document.createElement('div'); t.className = 'toast' + (err?' err':''); t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), err ? 6000 : 2600);
}
function chk(res){ if (res.error) { console.error(res.error); throw new Error(res.error.message); } return res.data; }
async function guard(fn){ try { return await fn(); } catch(e){ toast(e.message || String(e), true); } }

async function fetchAll(build, page=1000){
  let out = [], from = 0;
  while (true) {
    const { data, error } = await build().range(from, from + page - 1);
    if (error) throw new Error(error.message);
    out = out.concat(data); if (data.length < page) break; from += page;
  }
  return out;
}

// ---------------------------------------------------------------- MODAL
function modal(html, onMount){
  const root = $('#modalRoot');
  const bg = document.createElement('div'); bg.className = 'modal-bg';
  bg.innerHTML = `<div class="modal">${html}</div>`;
  bg.addEventListener('mousedown', e => { if (e.target === bg) close(); });
  root.appendChild(bg);
  const close = () => bg.remove();
  const el = $('.modal', bg);
  $$('[data-close]', el).forEach(b => b.onclick = close);
  onMount && onMount(el, close);
  return close;
}
function confirmar(msg, okTxt='Confirmar'){
  return new Promise(res => modal(`<h2>Confirmar</h2><p>${msg}</p><div class="mfoot"><button class="btn sec" data-close>Cancelar</button><button class="btn" id="ok">${okTxt}</button></div>`,
    (el, close) => { $('#ok', el).onclick = () => { close(); res(true); }; $$('[data-close]', el).forEach(b => b.addEventListener('click', () => res(false))); }));
}

// Selector de items con búsqueda (sirve para celular)
function pickItem({ tipos=['mp','envase','interno'], titulo='Elegir', excluir=[] } = {}){
  return new Promise(res => {
    const lista = S.items.filter(i => tipos.includes(i.tipo) && i.activo && !excluir.includes(i.id));
    modal(`<h2>${titulo}</h2><input id="q" placeholder="Buscar por código o nombre…" autocomplete="off"><div class="list" id="l" style="margin-top:8px"></div>
      <div class="mfoot"><button class="btn sec" data-close>Cancelar</button></div>`, (el, close) => {
      const draw = () => {
        const q = $('#q', el).value.trim().toUpperCase();
        const f = lista.filter(i => !q || i.codigo.toUpperCase().includes(q) || i.nombre.toUpperCase().includes(q) || (i.alias||'').toUpperCase().includes(q)).slice(0, 80);
        $('#l', el).innerHTML = f.map(i => `<div class="it" data-id="${i.id}"><span class="badge ${tipoBadge(i.tipo)}">${esc(i.codigo)}</span><span style="flex:1">${esc(i.nombre)}</span><span class="muted small">${esc(i.unidad)}</span></div>`).join('') || '<p class="muted">Sin resultados</p>';
        $$('.it', el).forEach(d => d.onclick = () => { close(); res(S.itemById[d.dataset.id]); });
      };
      $('#q', el).oninput = draw; draw(); setTimeout(() => $('#q', el).focus(), 50);
      $$('[data-close]', el).forEach(b => b.addEventListener('click', () => res(null)));
    });
  });
}
const tipoBadge = t => ({mp:'b-gray', envase:'b-ok', interno:'b-info', producto:'b-warn'}[t] || 'b-gray');
const tipoTxt = t => ({mp:'Materia prima', envase:'Envase', interno:'Fabricación interna', producto:'Producto'}[t] || t);
const origenBadge = o => ({compra:'<span class="badge b-ok">Compra</span>', reposicion:'<span class="badge b-warn">Reposición (manual)</span>',
  fabricacion:'<span class="badge b-info">Fabricación interna</span>', importacion:'<span class="badge b-gray">Planilla</span>',
  partida:'<span class="badge b-gray">Usado en partida</span>', relevamiento:'<span class="badge b-info">Relevamiento planilla mensual</span>'}[o] || esc(o||'—'));
function edadBadge(dias){
  if (dias == null) return '<span class="badge b-bad">Sin valuar</span>';
  if (dias <= 30) return `<span class="badge b-ok">${dias} d</span>`;
  if (dias <= 90) return `<span class="badge b-warn">${dias} d</span>`;
  return `<span class="badge b-bad">${dias} d</span>`;
}

// ---------------------------------------------------------------- DATOS BASE
async function cargarBase(){
  const [items, prov, val, cot, bases] = await Promise.all([
    fetchAll(() => sb.from('items').select('*').order('codigo')),
    fetchAll(() => sb.from('proveedores').select('*').order('nombre')),
    fetchAll(() => sb.from('v_ultima_valuacion').select('*')),
    sb.from('cotizaciones').select('*').order('fecha', {ascending:false}).limit(1),
    fetchAll(() => sb.from('mp_base').select('*').order('nombre'))
  ]);
  S.bases = bases; S.baseById = Object.fromEntries(bases.map(b => [b.id, b]));
  S.items = items; S.itemById = Object.fromEntries(items.map(i => [i.id, i]));
  S.prov = prov; S.val = Object.fromEntries(val.map(v => [v.item_id, v]));
  const c = chk(cot)[0]; S.dolar = c ? Number(c.valor) : null; S.dolarFecha = c ? c.fecha : null;
  pintarDolar();
}
async function recargarVal(){
  const val = await fetchAll(() => sb.from('v_ultima_valuacion').select('*'));
  S.val = Object.fromEntries(val.map(v => [v.item_id, v]));
}
async function recargarItems(){
  S.bases = await fetchAll(() => sb.from('mp_base').select('*').order('nombre')); S.baseById = Object.fromEntries(S.bases.map(b => [b.id, b]));
  S.items = await fetchAll(() => sb.from('items').select('*').order('codigo'));
  S.itemById = Object.fromEntries(S.items.map(i => [i.id, i]));
}
function pintarDolar(){
  const h = $('#hdrDolar'); h.classList.remove('hidden');
  h.innerHTML = S.dolar ? `U$S ${ars(S.dolar,0)} <span class="dfe" style="opacity:.6">${fd(S.dolarFecha)}</span>` : 'Cargar dólar';
  h.onclick = (can('compras') || can('precios') || can('produccion') || can('gastos')) ? editarDolar : null; h.style.cursor = h.onclick ? 'pointer' : 'default';
}
function editarDolar(){
  modal(`<h2>Dólar oficial BNA</h2><p class="muted small">Se usa para pasar a pesos y como sugerencia en compras y producción.</p>
    <div class="row"><div><label class="f">Fecha</label><input type="date" id="f" value="${hoy()}"></div>
    <div><label class="f">Valor ($ por U$S)</label><input inputmode="decimal" id="v" value="${S.dolar||''}"></div></div>
    <div class="mfoot"><button class="btn sec" data-close>Cancelar</button><button class="btn" id="ok">Guardar</button></div>`, (el, close) => {
    $('#ok', el).onclick = () => guard(async () => {
      const v = num($('#v', el).value); if (!v) throw new Error('Ingresá el valor');
      chk(await sb.from('cotizaciones').upsert({ fecha: $('#f', el).value, valor: v, fuente:'BNA oficial' }));
      if ($('#f', el).value >= (S.dolarFecha||'')) { S.dolar = v; S.dolarFecha = $('#f', el).value; }
      pintarDolar(); close(); toast('Dólar guardado');
    });
  });
}
async function dolarDe(fecha){
  const { data } = await sb.from('cotizaciones').select('valor,fecha').lte('fecha', fecha).order('fecha', {ascending:false}).limit(1);
  return data && data[0] ? Number(data[0].valor) : S.dolar;
}

// ---------------------------------------------------------------- RUTEO
const RUTAS = [
  { id:'inicio',     ic:'🏠', t:'Inicio' },
  { id:'compras',    ic:'🧾', t:'Compras' },
  { id:'precios',    ic:'💲', t:'Precios' },
  { id:'produccion', ic:'🧪', t:'Reg. Producción' },
  { id:'recetas',    ic:'📋', t:'Recetas' },
  { id:'stock',      ic:'📦', t:'Stock' },
  { id:'gastos',     ic:'⚡', t:'Gastos directos de Fábrica' },
  { id:'informes',   ic:'📊', t:'Informes' },
  { id:'config',     ic:'⚙️', t:'Ajustes' },
];
const MOVIL = ['inicio','compras','precios','produccion','mas'];
function pintarNav(){
  const ancho = window.innerWidth >= 900;
  const actual = (location.hash || '#inicio').slice(1);
  const lista = ancho ? RUTAS : RUTAS.filter(r => MOVIL.includes(r.id)).concat([{id:'mas', ic:'☰', t:'Más'}]);
  $('#nav').innerHTML = lista.map(r => `<a href="#${r.id}" class="${r.id===actual || (r.id==='mas' && !MOVIL.includes(actual)) ? 'on':''}"><span class="ic">${r.ic}</span>${r.t}</a>`).join('');
}
window.addEventListener('resize', pintarNav);
window.addEventListener('hashchange', router);
async function router(){
  if (!S.user) return;
  const id = (location.hash || '#inicio').slice(1);
  pintarNav();
  setPrint('Uxell Costos · ' + ((RUTAS.find(r => r.id === id) || {}).t || ''));
  const app = $('#app'); app.innerHTML = '<p class="muted">Cargando…</p>';
  const fn = VISTAS[id] || VISTAS.inicio;
  await guard(() => fn(app));
  window.scrollTo(0,0);
}
const VISTAS = {};
// Encabezado de impresión y de Excel: logo, título y filtros elegidos
let PRINT = { titulo: 'Uxell Costos', filtros: () => [] };
function setPrint(titulo, filtros){ PRINT = { titulo, filtros: filtros || (() => []) }; }
const V = sel => { const e = $(sel); return e ? (e.value || '').trim() : ''; };
const segTxt = sel => { const b = $(sel + ' button.on'); return b ? b.textContent.trim() : ''; };
const selTxt = sel => { const e = $(sel); return e && e.selectedIndex >= 0 ? e.options[e.selectedIndex].text : ''; };
const chkd = sel => { const e = $(sel); return !!(e && e.checked); };
const fdi = v => v ? (v.length === 7 ? nomMesLargo(v + '-01') : fd(v)) : '';
function filtrosLista(){ try { return (PRINT.filtros() || []).filter(f => f && f[1] != null && f[1] !== ''); } catch (e) { return []; } }
function imprimir(){
  const f = filtrosLista();

// =====================================================================
//  INICIO
// =====================================================================
VISTAS.inicio = async app => {
  const mesIni = mesActual() + '-01';
  const d5 = new Date(); d5.setDate(1); d5.setMonth(d5.getMonth() - 4); const desde5 = d5.toISOString().slice(0,7) + '-01';
  const [rev, borr, gm, meses, prodMes, consMes, stock] = await Promise.all([
    fetchAll(() => sb.from('v_revision_precios').select('item_id,codigo,nombre,tipo,unidad,dias,fecha,costo_usd,origen,control_valor')),
    sb.from('partidas').select('id,nro,fecha,producto_id').eq('estado','borrador').order('fecha'),
    sb.from('gastos_mes').select('periodo').eq('periodo', mesIni).maybeSingle(),
    sb.from('v_mes_produccion').select('*').gte('periodo', desde5).order('periodo'),
    sb.from('v_prod_mes_producto').select('*').eq('periodo', mesIni).order('litros', { ascending:false }).limit(10),
    sb.from('v_consumo_mes_base').select('*').eq('periodo', mesIni).order('usd', { ascending:false }).limit(10),
    fetchAll(() => sb.from('v_stock_base').select('*').order('nombre')) ]);
  const borradores = chk(borr), M = chk(meses), PM = chk(prodMes), CM = chk(consMes);
  const [gfMes, gfTot, gfConc] = await Promise.all([sb.from('gastos_fabrica').select('*').eq('periodo', mesIni).order('id'), sb.from('v_gastos_fabrica_mes').select('*').eq('periodo', mesIni).maybeSingle(), conceptosGasto()]);
  const GFm = chk(gfMes), GFt = gfTot.data, gcm = Object.fromEntries(gfConc.map(c => [c.id, c]));
  const viejos = rev.filter(r => r.tipo !== 'interno' && r.control_valor !== false && (r.dias == null || r.dias > 60)).sort((a,b) => (b.dias ?? 99999) - (a.dias ?? 99999));
  const neg = stock.filter(r => r.stock < 0);
  const lista5 = []; for (let i = 4; i >= 0; i--) { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - i); lista5.push(d.toISOString().slice(0,7) + '-01'); }
  const porMes = Object.fromEntries(M.map(x => [x.periodo, x]));
  const mesAct = porMes[mesIni] || { partidas:0, litros:0 };
  const nomMes = p => new Date(p + 'T12:00').toLocaleDateString('es-AR', { month:'short', year:'2-digit' });
  const barras = (rows, val, fmt, lab) => { const mx = Math.max(...rows.map(val), 1);
    return rows.map(r => `<div class="barra"><span class="nm" title="${esc(lab(r))}">${esc(lab(r))}</span><span class="bg"><span class="fg" style="display:block;width:${(val(r)/mx*100).toFixed(1)}%"></span></span><span class="v">${fmt(val(r))}</span></div>`).join(''); };
  const nombreMes = new Date().toLocaleDateString('es-AR', { month:'long' });

  app.innerHTML = `
    <div class="hero"><img src="logo.png" alt="Üxell"><div><div class="t">Tablero de producción${!['compras','precios','recetas','produccion','gastos'].some(can) ? ' <span class="badge b-gray" style="vertical-align:middle">Solo consulta</span>' : ''}</div><div class="s">Hola ${esc(S.perfil.nombre || '')} · ${new Date().toLocaleDateString('es-AR', { weekday:'long', day:'numeric', month:'long' })}</div></div></div>
    <div class="grid" style="margin-bottom:12px">
      <div class="kpi"><div class="l">Litros fabricados en ${nombreMes}</div><div class="v">${nf(mesAct.litros,0)}</div><div class="l">${mesAct.partidas} partidas</div></div>
      <div class="kpi"><div class="l">Promedio últimos 5 meses</div><div class="v">${nf(lista5.reduce((s,p) => s + Number(porMes[p]?.litros||0), 0) / 5, 0)}</div><div class="l">litros por mes</div></div>
      <div class="kpi"><div class="l">Precios con más de 60 días</div><div class="v" style="color:${viejos.length ? 'var(--bad)' : 'var(--ok)'}">${viejos.length}</div><div class="l">insumos y envases</div></div>
      <div class="kpi"><div class="l">Dólar BNA</div><div class="v">${S.dolar ? ars(S.dolar,0) : '—'}</div><div class="l">${fd(S.dolarFecha)}</div></div>
    </div>
    ${S.dolarFecha !== hoy() ? `<div class="alert info">El dólar cargado es del ${fd(S.dolarFecha)}. <a href="#" id="actDolar">Actualizar dólar de hoy</a></div>` : ''}
    ${borradores.length ? `<div class="alert">Hay ${borradores.length} partida(s) en borrador sin cerrar: ${borradores.map(b => `<a href="#produccion" data-p="${b.id}">#${b.nro}</a>`).join(', ')}</div>` : ''}
    ${!gm.data && new Date().getDate() > 25 ? `<div class="alert info">Todavía no se cargaron los Gastos directos de Fábrica de ${nombreMes}. <a href="#gastos">Cargarlos</a></div>` : ''}
    <div class="row noprint" style="margin-bottom:12px">
      ${can('compras') ? '<button class="btn" onclick="location.hash=\'compras\';setTimeout(()=>nuevaCompra(),300)">+ Nueva compra</button>' : ''}
      ${can('produccion') ? '<button class="btn" onclick="location.hash=\'produccion\';setTimeout(()=>editorPartida(null),300)">+ Registro de Producción</button>' : ''}
      <button class="btn sec" onclick="informe='costos';location.hash='informes'">Lista de costos</button>
    </div>
    <div class="dash">
      <div class="card full"><h2>Litros fabricados · últimos 5 meses</h2><div class="chartbox" style="height:230px"><canvas id="chMeses"></canvas></div></div>
      <div class="card"><h2>Productos más producidos en ${nombreMes}</h2>
        ${PM.length ? barras(PM, r => Number(r.litros), v => nf(v,0) + ' lt', r => (S.itemById[r.producto_id]?.codigo || '') + ' · ' + (S.itemById[r.producto_id]?.nombre || '')) : '<p class="muted small">Todavía no hay partidas cerradas este mes.</p>'}</div>
      <div class="card"><h2>Materias primas más utilizadas en ${nombreMes}</h2>
        ${CM.length ? `<div class="minitw"><table><thead><tr><th>Materia prima</th><th class="n">Cantidad</th><th class="n">U$S</th></tr></thead><tbody>${CM.map(c =>
          `<tr><td><b>${esc(c.nombre)}</b> <span class="small muted">${esc(c.codigos)}</span></td><td class="n">${nf(c.cantidad,0)} ${esc(c.unidad||'')}</td><td class="n">${nf(c.usd,0)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="muted small">Todavía no hay consumos este mes.</p>'}</div>
      <div class="card"><h2>Gastos directos de Fábrica · ${nombreMes}</h2>
        ${GFm.length ? `<div class="minitw"><table><thead><tr><th>Egreso</th><th class="n">Total $</th><th class="n">%</th><th class="n">Asignado $</th></tr></thead><tbody>
          ${GFm.sort((a, b) => (gcm[a.concepto_id]?.orden ?? 999) - (gcm[b.concepto_id]?.orden ?? 999)).map(g => `<tr><td><b>${esc(gcm[g.concepto_id]?.nombre)}</b>${g.detalle ? ` <span class="small muted">${esc(g.detalle)}</span>` : ''}</td><td class="n">${nf(g.importe_ars,0)}</td><td class="n">${pctTxt(g.pct_asignacion)}</td><td class="n">${nf(g.importe_asignado_ars,0)}</td></tr>`).join('')}
          <tr><td><b>TOTAL</b></td><td class="n"><b>${nf(GFt?.total_ars,0)}</b></td><td></td><td class="n"><b>${nf(GFt?.asignado_ars,0)}</b></td></tr></tbody></table></div>
          <p class="small" style="margin:6px 0 0">Por litro: <b>${GFt?.ars_lt ? ars(GFt.ars_lt, 2) : '—'}</b>${GFt?.usd_lt ? ' · ' + usd(GFt.usd_lt, 4) : ''} · <a href="#gastos">Ver / cargar</a></p>`
          : `<p class="muted small">Todavía no se cargaron gastos este mes. <a href="#gastos">Cargar Gastos directos de Fábrica</a></p>`}</div>
      <div class="card"><h2>Precios con más de 60 días sin actualizar <span class="badge b-bad">${viejos.length}</span></h2>
        ${viejos.length ? `<div class="minitw"><table><thead><tr><th>Insumo / envase</th><th class="n">U$S</th><th>Última valuación</th></tr></thead><tbody>${viejos.map(r => `<tr class="click" data-v="${r.item_id}"><td><b>${esc(r.codigo)}</b> <span class="small">${esc(r.nombre)}</span></td><td class="n">${nf(r.costo_usd,3)}</td><td class="nowrap">${r.fecha ? fd(r.fecha) : ''} ${edadBadge(r.dias)}</td></tr>`).join('')}</tbody></table></div>` : '<p class="small" style="color:var(--ok)">Todos los precios están actualizados ✅</p>'}</div>
      <div class="card"><h2>Stock de materias primas ${neg.length ? `<span class="badge b-bad">${neg.length} negativos</span>` : ''}</h2>
        <input id="qStock" placeholder="Buscar materia prima…" style="margin-bottom:6px">
        <div class="minitw" id="tbStock"></div>
        <p class="small muted" style="margin:6px 0 0">${stock.some(r => r.tiene_inicial) ? '' : 'Todavía no se cargó el stock inicial: los saldos no son confiables. '}<a href="#stock">Ver stock completo</a></p></div>
    </div>`;

  // gráfico de los últimos 5 meses
  new Chart($('#chMeses', app), { type:'bar',
    data:{ labels: lista5.map(nomMes), datasets:[{ label:'Litros', data: lista5.map(p => Number(porMes[p]?.litros || 0)),
      backgroundColor: lista5.map((p, i) => i === 4 ? '#f5c518' : '#6b2fd6'), borderRadius:6 }] },
    options:{ maintainAspectRatio:false, plugins:{ legend:{ display:false }, tooltip:{ callbacks:{ label: c => nf(c.raw,0) + ' litros · ' + (porMes[lista5[c.dataIndex]]?.partidas || 0) + ' partidas' } } },
      scales:{ y:{ ticks:{ callback: v => nf(v,0) } } } } });

  // stock de materias primas
  const drawStock = () => { const q = ($('#qStock', app).value || '').toUpperCase();
    const f = stock.filter(r => !q || (r.nombre + ' ' + r.lista_codigos).toUpperCase().includes(q)).sort((a, b) => (a.stock < 0) === (b.stock < 0) ? a.nombre.localeCompare(b.nombre, 'es') : (a.stock < 0 ? -1 : 1));
    $('#tbStock', app).innerHTML = `<table><thead><tr><th>Materia prima</th><th class="n">Stock</th><th></th></tr></thead><tbody>${f.map(r => `<tr class="click" data-s="${r.mp_base_id}"><td><b>${esc(r.nombre)}</b> <span class="small muted">${esc(r.lista_codigos)}</span></td>
      <td class="n" style="${r.stock < 0 ? 'color:var(--bad);font-weight:600' : ''}">${nf(r.stock,1)} ${esc(r.unidad)}</td>
      <td>${!r.tiene_inicial ? '<span class="badge b-gray">sin inicial</span>' : r.stock < 0 ? '<span class="badge b-bad">negativo</span>' : r.stock_minimo && r.stock < r.stock_minimo ? '<span class="badge b-warn">bajo mín.</span>' : '<span class="badge b-ok">ok</span>'}</td></tr>`).join('')}</tbody></table>`;
    $$('[data-s]', app).forEach(tr => tr.onclick = () => fichaBase(Number(tr.dataset.s))); };
  $('#qStock', app).oninput = drawStock; drawStock();
  $$('[data-v]', app).forEach(tr => tr.onclick = () => fichaPrecio(Number(tr.dataset.v), () => VISTAS.inicio(app)));
  const a = $('#actDolar', app); if (a) a.onclick = e => { e.preventDefault(); editarDolar(); };
  $$('[data-p]', app).forEach(x => x.onclick = e => { e.preventDefault(); location.hash = 'produccion'; setTimeout(() => editorPartida(Number(x.dataset.p)), 300); });
};

let filtroCompras = 'pend_ent';
VISTAS.compras = async app => {
  app.innerHTML = `<h1>Compras de materia prima</h1>
    <div class="bar">
      <div class="seg" id="seg">
        <button data-f="pend_ent">Falta entrega</button><button data-f="pend_pago">Falta pago</button><button data-f="todas">Todas</button>
      </div>
      <input class="grow" id="q" placeholder="Buscar insumo, proveedor, OC…">
      <input type="month" id="mes" style="max-width:170px">
      ${can('compras') ? '<button class="btn" id="nueva">+ Nueva compra</button>' : ''}
    </div>
    <div class="card"><div class="tw" id="tabla"><p class="muted">Cargando…</p></div></div>`;
  const draw = async () => {
    $$('#seg button', app).forEach(b => b.classList.toggle('on', b.dataset.f === filtroCompras));
    let qb = () => {
      let q = sb.from('compras').select('*').order('fecha', {ascending:false}).order('id', {ascending:false});
      if (filtroCompras === 'pend_ent') q = q.is('fecha_entrega', null).eq('origen','app');
      if (filtroCompras === 'pend_pago') q = q.is('fecha_pago', null).eq('origen','app');
      const m = $('#mes', app).value;
      if (m) { const [y, mm] = m.split('-').map(Number); const fin = new Date(y, mm, 1).toISOString().slice(0,10); q = q.gte('fecha', m + '-01').lt('fecha', fin); }
      return q;
    };
    let rows = filtroCompras === 'todas' && !$('#mes', app).value ? chk(await qb().limit(300)) : await fetchAll(qb);
    const t = $('#q', app).value.trim().toUpperCase();
    const pmap = Object.fromEntries(S.prov.map(p => [p.id, p.nombre]));
    if (t) rows = rows.filter(r => { const i = S.itemById[r.item_id] || {}; return (i.codigo + ' ' + i.nombre + ' ' + (pmap[r.proveedor_id]||'') + ' ' + (r.oc||'') + ' ' + (r.factura_nro||'')).toUpperCase().includes(t); });
    $('#tabla', app).innerHTML = rows.length ? `<table><thead><tr><th>Fecha</th><th>Insumo</th><th class="hm">Proveedor</th><th class="n">Cantidad</th><th class="n hm">Precio</th><th class="n hm">Costo unit. U$S</th><th class="n">Costo unit. total U$S <span class="small" style="font-weight:400">(c/gastos)</span></th><th>Entrega</th><th>Pago</th></tr></thead><tbody>${
      rows.map(r => { const i = S.itemById[r.item_id] || {};
        return `<tr class="click" data-id="${r.id}"><td class="nowrap">${fd(r.fecha)}</td><td><b>${esc(i.codigo)}</b> ${esc(i.nombre)}${r.lote_proveedor ? ` <span class="small muted">· lote ${esc(r.lote_proveedor)}</span>` : ''}</td><td class="hm">${esc(pmap[r.proveedor_id]||'—')}</td>
        <td class="n">${nf(r.cantidad,1)} ${esc(i.unidad||'')}</td><td class="n hm">${r.moneda==='ARS'?'$':'U$S'} ${nf(r.precio_unit,2)}</td>
        <td class="n hm">${nf(r.precio_unit_usd,3)}</td><td class="n">${r.costo_con_gastos_usd != null ? nf(r.costo_con_gastos_usd,3) : '<span class="muted small">sin entrega</span>'}</td>
        <td>${r.fecha_entrega ? `<span class="badge b-ok">${fd(r.fecha_entrega)}</span>` : (r.origen==='importacion' ? '<span class="badge b-gray">planilla</span>' : '<span class="badge b-warn">pendiente</span>')}</td>
        <td>${r.fecha_pago ? `<span class="badge b-ok">${fd(r.fecha_pago)}</span>` : (r.origen==='importacion' ? '' : '<span class="badge b-warn">pendiente</span>')}</td></tr>`; }).join('')
    }</tbody></table>` : '<p class="muted">No hay compras para mostrar.</p>';
    $$('tr[data-id]', app).forEach(tr => tr.onclick = () => nuevaCompra(Number(tr.dataset.id)));
  };
  $$('#seg button', app).forEach(b => b.onclick = () => { filtroCompras = b.dataset.f; draw(); });
  $('#q', app).oninput = () => draw(); $('#mes', app).onchange = draw;
  const n = $('#nueva', app); if (n) n.onclick = () => nuevaCompra();
  VISTAS._reloadCompras = draw;
  await draw();
};

async function nuevaCompra(id){
  let c = { fecha: hoy(), moneda:'USD', cotizacion: S.dolar, flete:0, seguro:0, otros_gastos:0 };
  if (id) c = chk(await sb.from('compras').select('*').eq('id', id).single());
  const ro = !can('compras');
  const item = c.item_id ? S.itemById[c.item_id] : null;
  const provNombre = c.proveedor_id ? (S.prov.find(p => p.id === c.proveedor_id)||{}).nombre : '';
  const v = (k, d='') => c[k] ?? d;
  modal(`<h2>${id ? 'Compra' : 'Nueva compra'}</h2>
    ${c.origen==='importacion' ? `<div class="alert info small">Importada de las planillas viejas. ${esc(c.nota||'')}. No mueve stock ni precios.</div>` : ''}
    <h3>1 · Pedido</h3>
    <div class="row">
      <div style="flex:2 1 260px"><label class="f">Insumo / envase</label><button class="btn sec" id="pick" style="width:100%;text-align:left" ${ro?'disabled':''}>${item ? esc(item.codigo + ' · ' + item.nombre) : 'Elegir…'}</button></div>
      <div><label class="f">Fecha de compra</label><input type="date" id="fecha" value="${v('fecha')}"></div>
    </div>
    <div class="row">
      <div style="flex:2 1 220px"><label class="f">Proveedor</label><input id="prov" list="provs" value="${esc(provNombre)}" placeholder="Escribí o elegí"><datalist id="provs">${S.prov.map(p => `<option value="${esc(p.nombre)}">`).join('')}</datalist></div>
      <div><label class="f">Nº OC / pedido</label><input id="oc" value="${esc(v('oc'))}"></div>
    </div>
    <div class="row">
      <div><label class="f">Cantidad facturada <span id="uni">${item ? esc(item.unidad) : ''}</span></label><input inputmode="decimal" id="cantidad" value="${v('cantidad')}"></div>
      <div><label class="f">Cant. pedida / unidad pedido</label><div class="row" style="gap:4px"><input inputmode="decimal" id="cant_pedida" value="${v('cant_pedida')}" placeholder="ej. 4"><input id="unid_pedida" value="${esc(v('unid_pedida'))}" placeholder="TB, bolsa…"></div></div>
    </div>
    <div class="row">
      <div><label class="f">Moneda</label><select id="moneda"><option ${c.moneda==='USD'?'selected':''}>USD</option><option value="ARS" ${c.moneda==='ARS'?'selected':''}>ARS (pesos)</option></select></div>
      <div><label class="f">Precio unitario</label><input inputmode="decimal" id="precio_unit" value="${v('precio_unit')}"></div>
      <div><label class="f">Dólar BNA del día</label><input inputmode="decimal" id="cotizacion" value="${v('cotizacion')}"></div>
    </div>
    <div class="row">
      <div><label class="f">Condición de pago</label><input id="condicion_pago" value="${esc(v('condicion_pago'))}" placeholder="ej. 30 días"></div>
      <div><label class="f">Fecha estimada entrega</label><input type="date" id="fecha_estimada" value="${v('fecha_estimada')}"></div>
      <div><label class="f">Nº factura</label><input id="factura_nro" value="${esc(v('factura_nro'))}"></div>
      <div><label class="f">Lote del proveedor</label><input id="lote_proveedor" value="${esc(v('lote_proveedor'))}" placeholder="opcional"></div>
    </div>
    <h3>2 · Entrega <span class="muted small">(lo recibido es lo que suma al stock)</span></h3>
    <div class="row">
      <div><label class="f">Fecha entrega</label><input type="date" id="fecha_entrega" value="${v('fecha_entrega')}"></div>
      <div><label class="f">Remito</label><input id="remito" value="${esc(v('remito'))}"></div>
      <div><label class="f">Cantidad recibida</label><input inputmode="decimal" id="cant_recibida" value="${v('cant_recibida')}"></div>
    </div>
    <div class="row">
      <div><label class="f">Flete <span class="mon"></span></label><input inputmode="decimal" id="flete" value="${v('flete',0)}"></div>
      <div><label class="f">Seguro <span class="mon"></span></label><input inputmode="decimal" id="seguro" value="${v('seguro',0)}"></div>
      <div><label class="f">Otros gastos <span class="mon"></span></label><input inputmode="decimal" id="otros_gastos" value="${v('otros_gastos',0)}"></div>
    </div>
    <h3>3 · Pago</h3>
    <div class="row">
      <div><label class="f">Fecha de pago</label><input type="date" id="fecha_pago" value="${v('fecha_pago')}"></div>
      <div><label class="f">Importe pagado</label><input inputmode="decimal" id="importe_pagado" value="${v('importe_pagado')}"></div>
      <div><label class="f">Medio de pago</label><input id="medio_pago" value="${esc(v('medio_pago'))}" placeholder="transferencia, echeq…"></div>
    </div>
    <div class="card" style="background:#f7f3ff;margin-top:12px" id="calc"></div>
    <div class="mfoot">${id && isAdmin() ? '<button class="btn bad" id="del">Eliminar</button>' : ''}<button class="btn sec" data-close>Cerrar</button>${ro ? '' : '<button class="btn" id="ok">Guardar</button>'}</div>`, (el, close) => {
    let it = item;
    const g = k => $('#'+k, el).value;
    const calc = () => {
      const mon = g('moneda'); $$('.mon', el).forEach(s => s.textContent = '(' + mon + ')');
      const cot = num(g('cotizacion')), p = num(g('precio_unit')), q = num(g('cantidad')), r = num(g('cant_recibida'));
      const gastos = (num(g('flete'))||0) + (num(g('seguro'))||0) + (num(g('otros_gastos'))||0);
      const div = mon === 'USD' ? 1 : cot;
      const sin = p != null && div ? p / div : null;
      const con = r && p != null && q && div ? (p*q + gastos) / div / r : null;
      $('#calc', el).innerHTML = `
        <div class="tot"><span>Costo unitario sin gastos</span><b>${usd(sin,4)} ${it ? '/' + esc(it.unidad) : ''}</b></div>
        <div class="tot"><span>Costo unitario con flete y seguro (sobre lo recibido)</span><b>${con ? usd(con,4) : '<span class="muted">al registrar la entrega</span>'}</b></div>
        <div class="tot"><span>Total de la compra</span><b>${p!=null && q ? (mon==='ARS' ? ars(p*q+gastos) + ' · ' : '') + usd((p*q+gastos)/(div||1),2) : '—'}</b></div>
        ${it && S.val[it.id] ? `<div class="small muted" style="margin-top:6px">Valuación anterior: ${usd(S.val[it.id].costo_usd,4)} (${fd(S.val[it.id].fecha)}, ${S.val[it.id].origen})${sin ? ' · variación ' + nf(((con||sin)/S.val[it.id].costo_usd - 1)*100,1) + '%' : ''}</div>` : ''}`;
    };
    $$('input,select', el).forEach(i => i.addEventListener('input', calc));
    $('#moneda', el).onchange = () => { calc(); if (g('moneda') === 'ARS') $('#cotizacion', el).focus(); };
    $('#fecha', el).onchange = async () => { const d = await dolarDe(g('fecha')); if (d) { $('#cotizacion', el).value = d; calc(); } };
    $('#cant_recibida', el).addEventListener('focus', () => { if (!g('cant_recibida') && g('cantidad')) $('#cant_recibida', el).value = g('cantidad'); });
    $('#fecha_entrega', el).addEventListener('change', () => { if (!g('cant_recibida') && g('cantidad')) $('#cant_recibida', el).value = g('cantidad'); calc(); });
    const pk = $('#pick', el); if (pk) pk.onclick = async () => { const x = await pickItem({ tipos:['mp','envase','interno'], titulo:'¿Qué se compró?' }); if (x) { it = x; pk.textContent = x.codigo + ' · ' + x.nombre; $('#uni', el).textContent = x.unidad; calc(); } };
    calc();
    const del = $('#del', el); if (del) del.onclick = async () => { if (await confirmar('¿Eliminar esta compra? También se borra su valuación y su entrada de stock.', 'Eliminar')) guard(async () => { chk(await sb.from('compras').delete().eq('id', id)); close(); toast('Eliminada'); await recargarVal(); VISTAS._reloadCompras && VISTAS._reloadCompras(); }); };
    const ok = $('#ok', el); if (ok) ok.onclick = () => guard(async () => {
      if (!it) throw new Error('Elegí el insumo');
      const cot = num(g('cotizacion')); if (!cot) throw new Error('Falta el dólar del día (BNA)');
      if (!num(g('cantidad'))) throw new Error('Falta la cantidad');
      if (num(g('precio_unit')) == null) throw new Error('Falta el precio');
      if (g('fecha_entrega') && !num(g('cant_recibida'))) throw new Error('Indicá la cantidad recibida');
      let prov_id = null; const pn = g('prov').trim();
      if (pn) {
        let p = S.prov.find(x => x.nombre.toUpperCase() === pn.toUpperCase());
        if (!p) { p = chk(await sb.from('proveedores').insert({ nombre: pn }).select().single()); S.prov.push(p); }
        prov_id = p.id;
      }
      const rec = { item_id: it.id, proveedor_id: prov_id, fecha: g('fecha'), oc: g('oc') || null,
        cantidad: num(g('cantidad')), cant_pedida: num(g('cant_pedida')), unid_pedida: g('unid_pedida') || null,
        moneda: g('moneda'), precio_unit: num(g('precio_unit')), cotizacion: cot, condicion_pago: g('condicion_pago') || null,
        fecha_estimada: g('fecha_estimada') || null, factura_nro: g('factura_nro') || null, lote_proveedor: g('lote_proveedor') || null,
        fecha_entrega: g('fecha_entrega') || null, remito: g('remito') || null, cant_recibida: g('fecha_entrega') ? num(g('cant_recibida')) : null,
        flete: num(g('flete'))||0, seguro: num(g('seguro'))||0, otros_gastos: num(g('otros_gastos'))||0,
        fecha_pago: g('fecha_pago') || null, importe_pagado: num(g('importe_pagado')), medio_pago: g('medio_pago') || null };
      if (id) chk(await sb.from('compras').update(rec).eq('id', id)); else chk(await sb.from('compras').insert(rec));
      await sb.from('cotizaciones').upsert({ fecha: rec.fecha, valor: cot }, { onConflict:'fecha', ignoreDuplicates:true });
      await recargarVal(); close(); toast('Compra guardada — precio actualizado');
      VISTAS._reloadCompras && VISTAS._reloadCompras();
    });
  });
}

let filtroPrecio = { tipo:'base', viejos:false, sinCtrl:false, q:'' };
VISTAS.precios = async app => {
  setPrint('Revisión de precios de materias primas y envases', () => [['Vista', segTxt('#seg')], ['Búsqueda', V('#q')],
    ['Antigüedad', chkd('#viejos') ? 'solo precios con más de 30 días' : ''], ['Control de valor', chkd('#sinCtrl') ? 'incluye los que no tienen control' : 'solo con control de valor']]);
  app.innerHTML = `<h1>Revisión de precios</h1>
    <p class="muted small" style="margin-top:-6px">Última valuación de cada insumo y de dónde salió. Verde ≤ 30 días · amarillo ≤ 90 · rojo más viejo.</p>
    <div class="bar">
      <div class="seg" id="seg"><button data-t="base">Por materia prima base</button><button data-t="mp">Por código</button><button data-t="envase">Envases</button><button data-t="interno">Fabricación interna</button></div>
      <input class="grow" id="q" placeholder="Buscar…" value="${esc(filtroPrecio.q)}">
      <label class="small nowrap"><input type="checkbox" id="viejos" style="width:auto" ${filtroPrecio.viejos?'checked':''}> Solo más de 30 días</label>
      <label class="small nowrap"><input type="checkbox" id="sinCtrl" style="width:auto" ${filtroPrecio.sinCtrl?'checked':''}> Ver también sin control de valor</label>
      ${can('precios') || can('compras') ? '<button class="btn sec" id="nuevo">+ Nuevo item</button>' : ''}
      <button class="btn sec" onclick="imprimir()">Imprimir</button>
    </div>
    <div class="card"><div class="tw" id="tabla"></div></div>`;
  const [rows, pbase] = await Promise.all([fetchAll(() => sb.from('v_revision_precios').select('*').order('codigo')), fetchAll(() => sb.from('v_precio_base').select('*'))]);
  const draw = () => {
    $$('#seg button', app).forEach(b => b.classList.toggle('on', b.dataset.t === filtroPrecio.tipo));
    const q = filtroPrecio.q.toUpperCase();
    if (filtroPrecio.tipo === 'base') {
      const pb = Object.fromEntries(pbase.map(x => [x.mp_base_id, x]));
      const f = S.bases.map(b => ({ b, p: pb[b.id], cods: S.items.filter(i => i.mp_base_id === b.id && (filtroPrecio.sinCtrl || i.control_valor !== false)) })).filter(x => x.cods.length
        && (!filtroPrecio.viejos || !x.p || x.p.dias > 30) && (!q || (x.b.nombre + ' ' + x.cods.map(c => c.codigo + ' ' + c.nombre).join(' ')).toUpperCase().includes(q)));
      $('#tabla', app).innerHTML = `<table><thead><tr><th>Materia prima</th><th class="hm">Códigos</th><th class="n">Último U$S</th><th class="n hm">$</th><th>Código / fecha</th><th>Antigüedad</th></tr></thead><tbody>${
        f.map(x => `<tr class="click" data-b="${x.b.id}"><td><b>${esc(x.b.nombre)}</b></td><td class="hm small">${x.cods.length > 1 ? `<span class="badge b-info">${x.cods.length} códigos</span> ` : ''}${esc(x.cods.map(c => c.codigo).join(', '))}</td>
          <td class="n">${x.p ? nf(x.p.costo_usd,4) : '—'}</td><td class="n hm">${x.p && S.dolar ? nf(x.p.costo_usd * S.dolar, 2) : '—'}</td>
          <td class="small">${x.p ? esc(x.p.codigo) + ' · ' + fd(x.p.fecha) : ''}</td><td>${edadBadge(x.p ? x.p.dias : null)}</td></tr>`).join('')}</tbody></table><p class="small muted">${f.length} materias primas</p>`;
      $$('tr[data-b]', app).forEach(tr => tr.onclick = () => fichaBase(Number(tr.dataset.b)));
      return;
    }
    const puedeCtrl = can('precios') || can('compras');
    const f = rows.filter(r => r.tipo === filtroPrecio.tipo && (filtroPrecio.sinCtrl || r.control_valor !== false) && (!filtroPrecio.viejos || r.dias == null || r.dias > 30)
      && (!q || (r.codigo + ' ' + r.nombre).toUpperCase().includes(q)));
    $('#tabla', app).innerHTML = `<table><thead><tr><th>Código</th><th>Nombre</th><th>Unid</th><th class="n">U$S / unid</th><th class="n hm">$ / unid</th><th class="hm">Fecha valuación</th><th>Antigüedad</th><th>Origen</th><th title="Control de valor">Control</th></tr></thead><tbody>${
      f.map(r => `<tr class="click" data-id="${r.item_id}" style="${r.control_valor === false ? 'opacity:.5' : ''}"><td><b>${esc(r.codigo)}</b></td><td>${esc(r.nombre)}</td><td>${esc(r.unidad)}</td>
        <td class="n">${nf(r.costo_usd,4)}</td><td class="n hm">${r.costo_usd!=null && S.dolar ? nf(r.costo_usd*S.dolar,2) : '—'}</td>
        <td class="hm">${fd(r.fecha)}</td><td>${edadBadge(r.dias)}</td><td>${origenBadge(r.origen)}${r.con_gastos ? ' <span class="badge b-info">c/flete</span>' : ''}</td>
        <td><input type="checkbox" data-ctrl="${r.item_id}" style="width:auto" ${r.control_valor !== false ? 'checked' : ''} ${puedeCtrl ? '' : 'disabled'} title="Control de valor"></td></tr>`).join('')
    }</tbody></table><p class="small muted">${f.length} items · destildá "Control" en los que ya no se compran para que no aparezcan en los controles de precios.</p>`;
    $$('tr[data-id]', app).forEach(tr => tr.onclick = e => { if (e.target.closest('[data-ctrl]')) return; fichaPrecio(Number(tr.dataset.id), () => VISTAS.precios(app)); });
    $$('[data-ctrl]', app).forEach(c => c.onchange = () => guard(async () => {
      chk(await sb.from('items').update({ control_valor: c.checked }).eq('id', Number(c.dataset.ctrl)));
      const r = rows.find(x => x.item_id === Number(c.dataset.ctrl)); if (r) r.control_valor = c.checked;
      const it = S.itemById[c.dataset.ctrl]; if (it) it.control_valor = c.checked;
      toast(c.checked ? 'Control de valor activado' : 'Ya no aparece en los controles de precios'); draw(); }));
  };
  $$('#seg button', app).forEach(b => b.onclick = () => { filtroPrecio.tipo = b.dataset.t; draw(); });
  $('#q', app).oninput = e => { filtroPrecio.q = e.target.value; draw(); };
  $('#viejos', app).onchange = e => { filtroPrecio.viejos = e.target.checked; draw(); };
  $('#sinCtrl', app).onchange = e => { filtroPrecio.sinCtrl = e.target.checked; draw(); };
  const n = $('#nuevo', app); if (n) n.onclick = () => editarItem(null, ['interno','base'].includes(filtroPrecio.tipo) ? 'mp' : filtroPrecio.tipo, () => VISTAS.precios(app));
  draw();
};

async function fichaPrecio(itemId, onDone){
  const it = S.itemById[itemId];
  const hist = chk(await sb.from('valuaciones').select('*').eq('item_id', itemId).order('fecha', {ascending:false}).order('creado_en', {ascending:false}).limit(40));
  const puede = can('precios') || can('compras');
  modal(`<h2>${esc(it.codigo)} · ${esc(it.nombre)}</h2>
    ${it.control_valor === false ? '<div class="alert small">Sin control de valor: no aparece en la revisión de precios ni en el tablero.</div>' : ''}
    <p class="muted small">${tipoTxt(it.tipo)} · unidad ${esc(it.unidad)}${it.tipo==='interno' ? ' · se valúa con el costo real de su última partida' : ''}</p>
    ${it.mp_base_id && S.items.filter(x => x.mp_base_id === it.mp_base_id).length > 1 ? `<div class="alert info small">Este código es parte de la materia prima base <b>${esc(S.baseById[it.mp_base_id]?.nombre)}</b> (${S.items.filter(x => x.mp_base_id === it.mp_base_id).length} códigos). <a href="#" id="verBase">Ver historial de precios y stock de la materia prima</a></div>` : ''}
    ${puede ? `<div class="card" style="background:#fffaf0"><h3 style="margin-top:0">Precio de reposición (ingreso manual)</h3>
      <div class="row"><div><label class="f">Fecha de valuación</label><input type="date" id="f" value="${hoy()}"></div>
      <div><label class="f">Moneda</label><select id="m"><option>USD</option><option value="ARS">ARS</option></select></div>
      <div><label class="f">Precio por ${esc(it.unidad)}</label><input inputmode="decimal" id="p"></div>
      <div><label class="f">Dólar BNA</label><input inputmode="decimal" id="c" value="${S.dolar||''}"></div></div>
      <div class="row"><div style="flex:3"><label class="f">Referencia / nota</label><input id="n" placeholder="ej. cotización proveedor X"></div><div style="flex:1"><button class="btn" id="ok" style="width:100%">Registrar</button></div></div></div>` : ''}
    <h3>Historial de valuaciones</h3>
    <div class="chartbox" style="height:180px"><canvas id="ch"></canvas></div>
    <div class="tw"><table><thead><tr><th>Fecha</th><th class="n">U$S</th><th class="n">Dólar</th><th>Origen</th><th>Nota</th></tr></thead><tbody>
    ${hist.map(h => `<tr><td>${fd(h.fecha)}</td><td class="n">${nf(h.costo_usd,4)}</td><td class="n">${nf(h.cotizacion,0)}</td><td>${origenBadge(h.origen)}</td><td class="small">${esc(h.nota||'')}</td></tr>`).join('') || '<tr><td colspan=5 class="muted">Sin valuaciones</td></tr>'}
    </tbody></table></div>
    <div class="mfoot">${puede ? '<button class="btn sec" id="ed">Editar item</button>' : ''}<button class="btn sec" data-close>Cerrar</button></div>`, (el, close) => {
    const h = hist.slice().reverse();
    if (h.length > 1) new Chart($('#ch', el), { type:'line', data:{ labels:h.map(x => fd(x.fecha)), datasets:[{ data:h.map(x => x.costo_usd), borderColor:'#6b2fd6', tension:.2, pointRadius:2 }] },
      options:{ plugins:{legend:{display:false}}, maintainAspectRatio:false, scales:{ y:{ title:{display:true,text:'U$S'} } } } });
    else $('#ch', el).parentElement.remove();
    const ed = $('#ed', el); if (ed) ed.onclick = () => { close(); editarItem(itemId, null, onDone); };
    const vb = $('#verBase', el); if (vb) vb.onclick = e => { e.preventDefault(); close(); fichaBase(it.mp_base_id); };
    const ok = $('#ok', el); if (ok) ok.onclick = () => guard(async () => {
      const p = num($('#p', el).value), c = num($('#c', el).value), m = $('#m', el).value;
      if (p == null) throw new Error('Ingresá el precio'); if (m === 'ARS' && !c) throw new Error('Falta el dólar');
      const costo = m === 'USD' ? p : p / c;
      chk(await sb.rpc('valuar_reposicion', { p_item: itemId, p_fecha: $('#f', el).value, p_costo_usd: costo, p_cotizacion: c, p_nota: $('#n', el).value || null }));
      await recargarVal(); close(); toast('Precio de reposición registrado'); onDone && onDone();
    });
  });
}

// Historial de precios y stock de una materia prima base (todos sus códigos)
async function fichaBase(baseId){
  const b = S.baseById[baseId]; if (!b) return;
  const cods = S.items.filter(i => i.mp_base_id === baseId); const ids = cods.map(i => i.id);
  const [vals, comps, stk] = await Promise.all([
    fetchAll(() => sb.from('valuaciones').select('item_id,fecha,costo_usd,origen').in('item_id', ids).order('fecha', { ascending:false })),
    fetchAll(() => sb.from('compras').select('fecha,item_id,proveedor_id,cantidad,precio_unit_usd,costo_con_gastos_usd,lote_proveedor').in('item_id', ids).order('fecha', { ascending:false })),
    fetchAll(() => sb.from('v_stock').select('item_id,stock').in('item_id', ids)) ]);
  const pmap = Object.fromEntries(S.prov.map(p => [p.id, p.nombre])), smap = Object.fromEntries(stk.map(x => [x.item_id, Number(x.stock)]));
  const total = stk.reduce((s, x) => s + Number(x.stock), 0);
  modal(`<h2>${esc(b.nombre)}</h2><p class="muted small" style="margin-top:-6px">Materia prima base · ${cods.length} código(s) · stock total <b>${nf(total,1)} ${esc(b.unidad)}</b></p>
    <h3>Códigos (proveedor / variante)</h3>
    <div class="tw"><table><thead><tr><th>Código</th><th>Nombre</th><th class="n">Stock</th><th class="n">Último U$S</th><th>Fecha</th></tr></thead><tbody>
    ${cods.map(i => { const v = S.val[i.id]; return `<tr class="click" data-i="${i.id}"><td><b>${esc(i.codigo)}</b></td><td class="small">${esc(i.nombre)}</td><td class="n">${nf(smap[i.id] || 0, 1)}</td><td class="n">${v ? nf(v.costo_usd,3) : '—'}</td><td>${v ? fd(v.fecha) : ''}</td></tr>`; }).join('')}</tbody></table></div>
    <h3>Evolución del precio (todos los proveedores)</h3>
    <div class="chartbox" style="height:200px"><canvas id="ch"></canvas></div>
    <h3>Compras</h3>
    <div class="tw" style="max-height:260px"><table><thead><tr><th>Fecha</th><th>Código</th><th>Proveedor</th><th>Lote</th><th class="n">Cant.</th><th class="n">Costo unitario U$S</th><th class="n">Costo unitario total U$S<br><span class="small" style="font-weight:400">(incluye gastos)</span></th></tr></thead><tbody>
    ${comps.map(c => `<tr><td>${fd(c.fecha)}</td><td>${esc(S.itemById[c.item_id]?.codigo)}</td><td>${esc(pmap[c.proveedor_id] || '')}</td><td>${esc(c.lote_proveedor || '')}</td><td class="n">${nf(c.cantidad,0)}</td><td class="n">${nf(c.precio_unit_usd,3)}</td><td class="n">${c.costo_con_gastos_usd != null ? nf(c.costo_con_gastos_usd,3) : '<span class="muted small">sin entrega</span>'}</td></tr>`).join('') || '<tr><td colspan=7 class="muted">Sin compras registradas</td></tr>'}</tbody></table></div>
    <h3>Valuaciones</h3>
    <div class="tw" style="max-height:220px"><table><thead><tr><th>Fecha</th><th>Código</th><th class="n">U$S</th><th>Origen</th></tr></thead><tbody>
    ${vals.map(v => `<tr><td>${fd(v.fecha)}</td><td>${esc(S.itemById[v.item_id]?.codigo)}</td><td class="n">${nf(v.costo_usd,4)}</td><td>${origenBadge(v.origen)}</td></tr>`).join('') || '<tr><td colspan=4 class="muted">Sin valuaciones</td></tr>'}</tbody></table></div>
    <div class="mfoot"><button class="btn sec" data-close>Cerrar</button></div>`, (el, close) => {
    $$('[data-i]', el).forEach(tr => tr.onclick = () => { close(); fichaPrecio(Number(tr.dataset.i)); });
    const pts = vals.map(v => ({ x: v.fecha, y: Number(v.costo_usd) })).concat(comps.map(c => ({ x: c.fecha, y: Number(c.costo_con_gastos_usd ?? c.precio_unit_usd) }))).sort((a, b) => a.x.localeCompare(b.x));
    if (pts.length > 1) new Chart($('#ch', el), { type:'line', data:{ labels: pts.map(p => fd(p.x)), datasets:[{ data: pts.map(p => p.y), borderColor:'#6b2fd6', tension:.2, pointRadius:3 }] },
      options:{ maintainAspectRatio:false, plugins:{ legend:{ display:false } }, scales:{ y:{ title:{ display:true, text:'U$S' } } } } });
    else $('#ch', el).parentElement.innerHTML = '<p class="muted small">Todavía no hay suficiente historial.</p>';
  });
}

        <td class="n"><input inputmode="decimal" data-i="${i}" value="${l.cantidad}" style="width:100px;text-align:right" ${puede?'':'readonly'}></td><td>${esc(it.unidad)}</td>

        <td>${puede ? `<button class="btn ghost sm" data-del="${i}">✕</button>` : ''}</td></tr>`; }).join('');
      $$('[data-i]', el).forEach(x => x.oninput = () => { lineas[x.dataset.i].cantidad = num(x.value) || 0; tot(); });
      $$('[data-del]', el).forEach(x => x.onclick = () => { lineas.splice(Number(x.dataset.del), 1); draw(); });
      tot();
    };
    const tot = () => {
      const ins = lineas.reduce((s, l) => s + l.cantidad * (S.val[l.insumo_id] ? Number(S.val[l.insumo_id].costo_usd) : 0), 0);

      } else if ($('#pt', el).value !== prod.tipo) {
        chk(await sb.from('items').update({ tipo: $('#pt', el).value }).eq('id', pid));
      }
      const rec = { producto_id: pid, cant_teorica: num($('#cant', el).value) || 1000, unidad: $('#uni', el).value || 'LT',
        merma_pct: (num($('#merma', el).value) || 0) / 100, notas: $('#notas', el).value || null, actualizado_en: new Date().toISOString(), actualizado_por: S.user.id };
      chk(await sb.from('recetas').upsert(rec));
      chk(await sb.from('receta_lineas').delete().eq('producto_id', pid));
      const ls = lineas.filter(l => l.cantidad > 0).map((l, i) => ({ producto_id: pid, insumo_id: l.insumo_id, cantidad: l.cantidad, orden: i }));
      if (ls.length) chk(await sb.from('receta_lineas').insert(ls));
      await recargarItems(); close(); toast('Receta guardada'); onDone && onDone();
    });
  });
}

      <div><label class="f"><b>Litros realmente producidos</b></label><input inputmode="decimal" id="litros_producidos" value="${P.litros_producidos??''}" ${ro?'readonly':''} style="border-color:var(--accent)"></div>
      <div><label class="f">Merma envasado %</label><input inputmode="decimal" id="merma" value="${nf(P.merma_pct*100,2)}" ${ro?'readonly':''}></div>
    </div>
    <h3>Insumos</h3>
    <div class="tw"><table class="ln"><thead><tr><th>Insumo</th><th class="n">Receta</th><th class="n">Real</th><th class="n">U$S/u</th><th>Valuado</th><th class="n">Subtotal</th><th></th></tr></thead><tbody id="lb"></tbody></table></div>
    ${!ro ? '<button class="btn sec sm" id="addI" style="margin-top:6px">+ Agregar insumo</button> <button class="btn ghost sm" id="refrescar">↻ Traer precios actuales</button>' : ''}
    <h3>Envasado</h3>
    <div class="tw"><table class="ln"><thead><tr><th>Envase</th><th class="n">Cantidad</th><th class="n">Litros</th><th class="n">U$S/envase</th><th class="n">Costo por envase lleno</th><th></th></tr></thead><tbody id="eb"></tbody></table></div>
    ${!ro ? '<button class="btn sec sm" id="addE" style="margin-top:6px">+ Agregar envase</button>' : ''}
    <h3>Pérdidas y otros costos</h3>
    <div class="row">
      <div><label class="f">Litros perdidos (producción fallida)</label><input inputmode="decimal" id="litros_perdidos" value="${P.litros_perdidos||0}" ${ro?'readonly':''}></div>
      <div style="flex:2 1 220px"><label class="f">Motivo</label><input id="motivo_perdida" value="${esc(P.motivo_perdida||'')}" ${ro?'readonly':''}></div>
    </div>
    <div class="row">
      <div><label class="f">Horas hombre</label><input inputmode="decimal" id="horas_hombre" value="${P.horas_hombre||0}" ${ro?'readonly':''}></div>
      <div><label class="f">Energía (U$S)</label><input inputmode="decimal" id="energia_usd" value="${P.energia_usd||0}" ${ro?'readonly':''}></div>
      <div><label class="f">Accesorios / otros (U$S)</label><input inputmode="decimal" id="accesorios_usd" value="${P.accesorios_usd||0}" ${ro?'readonly':''}></div>
    </div>
    <p class="small muted">Las horas hombre son informativas. La mano de obra, cargas sociales, energía y mantenimiento se cargan en "Gastos directos de Fábrica" y se reparten por litro.</p>
    <div class="card" style="background:#f7f3ff" id="res"></div>
    <div class="mfoot">
      <button class="btn sec" id="imp">Imprimir</button>
      ${!cerrada && id && can('produccion') ? '<button class="btn bad" id="del">Eliminar borrador</button>' : ''}
      <button class="btn sec" data-close>Cerrar</button>
      ${!ro ? '<button class="btn sec" id="guardar">Guardar borrador</button><button class="btn ok" id="cerrar">Cerrar partida</button>' : ''}
    </div>`, (el, close) => {
    const g = k => $('#'+k, el).value;
    const drawL = () => {
      $('#lb', el).innerHTML = lineas.map((l, i) => { const it = S.itemById[l.insumo_id] || {};
        const dias = l.fecha_valuacion ? Math.round((Date.now() - new Date(l.fecha_valuacion)) / 864e5) : null;
        const desv = l.cantidad_receta ? (l.cantidad / l.cantidad_receta - 1) * 100 : null;
        return `<tr><td><b>${esc(it.codigo)}</b> <span class="small">${esc(it.nombre)}</span></td>
          <td class="n muted">${l.cantidad_receta!=null ? nf(l.cantidad_receta,2) : '<span class="badge b-info">agregado</span>'}</td>
          <td class="n"><input inputmode="decimal" data-c="${i}" value="${l.cantidad}" style="width:95px;text-align:right" ${ro?'readonly':''}>${desv && Math.abs(desv) > 5 ? `<div class="small" style="color:var(--warn)">${desv>0?'+':''}${nf(desv,0)}%</div>` : ''}</td>
          <td class="n">${nf(l.costo_unit_usd,4)}</td><td class="small">${l.fecha_valuacion ? fd(l.fecha_valuacion) + ' ' + (ro ? '' : edadBadge(dias)) : (ro ? '' : '<span class="badge b-bad">s/precio</span>')}</td>
          <td class="n">${nf(l.cantidad * l.costo_unit_usd,2)}</td><td>${ro ? '' : `<button class="btn ghost sm" data-d="${i}">✕</button>`}</td></tr>`; }).join('');
      $$('[data-c]', el).forEach(x => x.oninput = () => { lineas[x.dataset.c].cantidad = num(x.value) || 0; res(); });
      $$('[data-d]', el).forEach(x => x.onclick = () => { lineas.splice(Number(x.dataset.d), 1); drawL(); });
      res();
    };
    const drawE = () => {
      $('#eb', el).innerHTML = envases.map((e, i) => { const it = S.itemById[e.envase_id] || {};
        return `<tr><td><b>${esc(it.codigo)}</b> <span class="small">${esc(it.nombre)}</span></td>
          <td class="n"><input inputmode="decimal" data-e="${i}" value="${e.cantidad}" style="width:85px;text-align:right" ${ro?'readonly':''}></td>
          <td class="n" data-lit="${i}">${nf((it.litros_envase||0) * e.cantidad,1)}</td><td class="n">${nf(e.costo_unit_usd,3)}</td>
          <td class="n" data-pres="${i}"></td><td>${ro ? '' : `<button class="btn ghost sm" data-de="${i}">✕</button>`}</td></tr>`; }).join('') || '<tr><td colspan=6 class="muted small">Sin envasar (producto para uso interno o a granel)</td></tr>';
      $$('[data-e]', el).forEach(x => x.oninput = () => { envases[x.dataset.e].cantidad = num(x.value) || 0; res(); });
      $$('[data-de]', el).forEach(x => x.onclick = () => { envases.splice(Number(x.dataset.de), 1); drawE(); });
      res();
    };
    const calc = () => {
      const ins = lineas.reduce((s, l) => s + l.cantidad * l.costo_unit_usd, 0);
      const merma = ins * ((num(g('merma'))||0)/100);
      const extra = (num(g('energia_usd'))||0) + (num(g('accesorios_usd'))||0);
      const env = envases.reduce((s, e) => s + e.cantidad * e.costo_unit_usd, 0);
      const lt = num(g('litros_producidos'));
      const envLt = envases.reduce((s, e) => s + e.cantidad * (S.itemById[e.envase_id]?.litros_envase || 0), 0);
      const granel = ins + merma + extra;
      return { ins, merma, extra, env, lt, envLt, granel, granelLt: lt ? granel/lt : null, envLtCosto: lt ? (granel+env)/lt : null };
    };
    const res = () => {
      const c = calc(), d = num(g('cotizacion')) || S.dolar;
      envases.forEach((e, i) => { const td = $(`[data-pres="${i}"]`, el); const it = S.itemById[e.envase_id] || {};
        if (td) td.textContent = c.granelLt ? nf(c.granelLt * (it.litros_envase||0) + Number(e.costo_unit_usd), 3) : '—';
        const tl = $(`[data-lit="${i}"]`, el); if (tl) tl.textContent = nf((it.litros_envase||0) * e.cantidad, 1); });
      const teor = num(g('cant_teorica'));
      $('#res', el).innerHTML = `
        <div class="tot"><span>Insumos</span><b>${usd(c.ins,2)}</b></div>
        <div class="tot"><span>Merma por envasado</span><b>${usd(c.merma,2)}</b></div>
        ${c.extra ? `<div class="tot"><span>Energía y accesorios</span><b>${usd(c.extra,2)}</b></div>` : ''}
        <div class="tot"><span>Envases</span><b>${usd(c.env,2)}</b></div>
        <div class="tot"><span>Litros envasados</span><b>${nf(c.envLt,1)}${c.lt && c.envLt ? ` <span class="small muted">(dif. ${nf(c.envLt - c.lt,1)})</span>` : ''}</b></div>
        ${!c.lt ? '<div class="alert bad" style="margin-top:8px">Cargá los litros realmente producidos (también si es para uso interno).</div>' : `
        <div class="tot"><span>① Costo granel por litro</span><b class="big">${usd(c.granelLt,4)}</b></div>
        <div class="tot"><span>② Costo con envase por litro</span><b class="big">${usd(c.envLtCosto,4)}</b></div>
        <div class="tot"><span>En pesos (granel / con envase)</span><b>${ars(c.granelLt*d)} / ${ars(c.envLtCosto*d)}</b></div>
        ${teor && Math.abs(c.lt/teor - 1) > 0.03 ? `<div class="small" style="color:var(--warn);margin-top:6px">Rendimiento ${nf(c.lt/teor*100,1)}% de lo teórico. Si se calculara sobre la teórica daría ${usd(c.granel/teor,4)}/lt.</div>` : ''}
        ${cerrada && P.costo_excel_lt_usd ? `<div class="small muted" style="margin-top:6px">La planilla original decía ${usd(P.costo_excel_lt_usd,4)}/lt (calculado sobre la cantidad teórica).</div>` : ''}
        <div class="small muted" style="margin-top:6px">③ El costo con Gastos directos de Fábrica se ve en Informes → Lista de costos una vez cargados los gastos del mes.</div>`}`;
    };
    $$('input', el).forEach(i => i.addEventListener('input', res));
    drawL(); drawE();
    const leer = () => ({ nro: P.nro, fecha: g('fecha'), fecha_envasado: g('fecha_envasado') || null, lote: g('lote') || null, producto_id: P.producto_id,
      cant_teorica: num(g('cant_teorica')), litros_producidos: num(g('litros_producidos')), merma_pct: (num(g('merma'))||0)/100,
      litros_perdidos: num(g('litros_perdidos'))||0, motivo_perdida: g('motivo_perdida') || null, horas_hombre: num(g('horas_hombre'))||0,
      energia_usd: num(g('energia_usd'))||0, accesorios_usd: num(g('accesorios_usd'))||0, cotizacion: num(g('cotizacion')) });
    const guardar = async () => {
      const rec = leer();
      if (!P.id) P.id = chk(await sb.from('partidas').insert(rec).select('id').single()).id;
      else chk(await sb.from('partidas').update(rec).eq('id', P.id));
      chk(await sb.from('partida_insumos').delete().eq('partida_id', P.id));
      chk(await sb.from('partida_envases').delete().eq('partida_id', P.id));
      const li = lineas.filter(l => l.cantidad > 0).map((l, i) => ({ partida_id: P.id, insumo_id: l.insumo_id, cantidad_receta: l.cantidad_receta, cantidad: l.cantidad,
        costo_unit_usd: l.costo_unit_usd, fecha_valuacion: l.fecha_valuacion, origen_valuacion: l.origen_valuacion, orden: i }));
      if (li.length) chk(await sb.from('partida_insumos').insert(li));
      const le = envases.filter(e => e.cantidad > 0).map(e => ({ partida_id: P.id, envase_id: e.envase_id, cantidad: e.cantidad, costo_unit_usd: e.costo_unit_usd }));
      if (le.length) chk(await sb.from('partida_envases').insert(le));
      chk(await sb.rpc('calcular_partida', { p_id: P.id }));
    };
    if (!ro) {
      $('#escalar', el).onclick = () => { const n = num(g('cant_teorica')); if (!n) return; const f = n / baseTeor;
        lineas.forEach(l => { if (l.cantidad_receta != null) { l.cantidad_receta = +(l.cantidad_receta * f).toFixed(4); l.cantidad = +(l.cantidad * f).toFixed(4); } });
        drawL(); toast('Receta escalada a ' + nf(n,0)); };
      $('#addI', el).onclick = async () => { const x = await pickItem({ tipos:['mp','interno'], titulo:'Agregar insumo', excluir:[P.producto_id] }); if (!x) return;
        const v = S.val[x.id]; lineas.push({ insumo_id: x.id, cantidad_receta: null, cantidad: 0, costo_unit_usd: v ? Number(v.costo_usd) : 0, fecha_valuacion: v?.fecha, origen_valuacion: v?.origen }); drawL(); };
      $('#addE', el).onclick = async () => { const x = await pickItem({ tipos:['envase'], titulo:'Agregar envase' }); if (!x) return;
        const v = S.val[x.id]; envases.push({ envase_id: x.id, cantidad: 0, costo_unit_usd: v ? Number(v.costo_usd) : 0 }); drawE(); };
      $('#refrescar', el).onclick = async () => { await recargarVal(); lineas.forEach(l => { const v = S.val[l.insumo_id]; if (v) { l.costo_unit_usd = Number(v.costo_usd); l.fecha_valuacion = v.fecha; l.origen_valuacion = v.origen; } });
        envases.forEach(e => { const v = S.val[e.envase_id]; if (v) e.costo_unit_usd = Number(v.costo_usd); }); drawL(); drawE(); toast('Precios actualizados'); };
      $('#guardar', el).onclick = () => guard(async () => { await guardar(); toast('Borrador guardado'); VISTAS._reloadProd && VISTAS._reloadProd(); });
      $('#cerrar', el).onclick = () => guard(async () => {
        if (!num(g('litros_producidos'))) throw new Error('Cargá los litros realmente producidos');
        const sinPrecio = lineas.filter(l => l.cantidad > 0 && !l.costo_unit_usd && !l.fecha_valuacion).length;
        if (sinPrecio && !(await confirmar(`${sinPrecio} insumo(s) no tienen precio (costo 0). ¿Cerrar igual?`))) return;
        await guardar();
        const falt = chk(await sb.rpc('faltantes_partida', { p_id: P.id }));
        if (falt.length) { const okF = await resolverFaltantes(falt, g('fecha')); if (!okF) return; }
        chk(await sb.rpc('cerrar_partida', { p_id: P.id }));
        await recargarVal(); close(); toast(`Partida ${P.nro} cerrada`); VISTAS._reloadProd && VISTAS._reloadProd();
      });
    }
    const del = $('#del', el); if (del) del.onclick = async () => { if (await confirmar('¿Eliminar este borrador?', 'Eliminar')) guard(async () => { chk(await sb.from('partidas').delete().eq('id', P.id)); close(); toast('Eliminado'); VISTAS._reloadProd && VISTAS._reloadProd(); }); };
    const re = $('#reabrir', el); if (re) re.onclick = async e => { e.preventDefault(); if (await confirmar('Se va a revertir el stock y la valuación de esta partida para poder editarla. ¿Reabrir?', 'Reabrir')) guard(async () => { chk(await sb.rpc('reabrir_partida', { p_id: P.id })); close(); await recargarVal(); editorPartida(P.id); }); };
    $('#imp', el).onclick = () => imprimirPartida(P, prod, lineas, envases, calc());
  });
}

function resolverFaltantes(falt, fecha){
  return new Promise(resolve => {
    modal(`<h2>Stock insuficiente</h2>
      <p class="small">Según el sistema no alcanza el stock de estos insumos. Si físicamente los tenés, registrá un <b>ajuste manual</b> (queda asentado como manual, sin compra).</p>
      <div class="tw"><table><thead><tr><th>Insumo</th><th class="n">Stock</th><th class="n">Necesita</th><th class="n">Ajuste a sumar</th></tr></thead><tbody>
      ${falt.map((f, i) => `<tr><td><b>${esc(f.codigo)}</b> <span class="small">${esc(f.nombre)}</span></td><td class="n">${nf(f.stock,2)}</td><td class="n">${nf(f.necesita,2)}</td>
        <td class="n"><input inputmode="decimal" data-a="${i}" value="${(-f.quedaria).toFixed(3)}" style="width:100px;text-align:right"></td></tr>`).join('')}
      </tbody></table></div>
      <div class="mfoot"><button class="btn sec" data-close>Volver</button><button class="btn sec" id="sin">Cerrar sin ajustar (queda negativo)</button><button class="btn" id="aj">Registrar ajustes y cerrar</button></div>`, (el, close) => {
      $$('[data-close]', el).forEach(b => b.addEventListener('click', () => resolve(false)));
      $('#sin', el).onclick = () => { close(); resolve(true); };
      $('#aj', el).onclick = () => guard(async () => {
        for (const x of $$('[data-a]', el)) {
          const f = falt[x.dataset.a], q = num(x.value);
          if (q) chk(await sb.rpc('ajustar_stock', { p_item: f.item_id, p_fecha: fecha, p_cantidad: q, p_nota: 'Ajuste manual al producir (lo tenían físicamente)', p_inicial: false }));
        }
        close(); resolve(true);
      });
    });
  });
}

function imprimirPartida(P, prod, lineas, envases, c){
  const w = window.open('', '_blank');
  if (!w) { toast('El navegador bloqueó la ventana de impresión', true); return; }
  w.document.write(`<html><head><title>Partida ${P.nro}</title><style>body{font:12px Arial;margin:20px}table{width:100%;border-collapse:collapse}td,th{border-bottom:1px solid #ccc;padding:4px;text-align:left}.n{text-align:right}h1{font-size:18px}</style></head><body>
    <div style="background:#fff;border:1.5px solid #333;padding:10px 14px;border-radius:8px;display:flex;align-items:center;gap:16px">
      <img src="${new URL('logo-claro.png', location.href)}" style="height:56px"><div style="color:#000"><b style="font-size:16px">Registro de Producción · Partida ${P.nro}</b><br><span style="font-size:11px">Emitido el ${fd(hoy())}</span></div></div>
    <h1>${esc(prod.codigo)} · ${esc(prod.nombre)}</h1>
    <p>Fecha ${fd(P.fecha)} · Lote ${esc(P.lote||'')} · Teórica ${nf(P.cant_teorica,0)} · Real ${nf(P.litros_producidos,0)} · Dólar ${nf(P.cotizacion,2)}</p>
    <table><tr><th>Código</th><th>Insumo</th><th class="n">Receta</th><th class="n">Real</th><th class="n">U$S/u</th><th class="n">Subtotal</th></tr>
    ${lineas.map(l => { const it = S.itemById[l.insumo_id]||{}; return `<tr><td>${esc(it.codigo)}</td><td>${esc(it.nombre)}</td><td class="n">${nf(l.cantidad_receta,2)}</td><td class="n">${nf(l.cantidad,2)}</td><td class="n">${nf(l.costo_unit_usd,4)}</td><td class="n">${nf(l.cantidad*l.costo_unit_usd,2)}</td></tr>`; }).join('')}</table>
    <h3>Envases</h3><table>${envases.map(e => { const it = S.itemById[e.envase_id]||{}; return `<tr><td>${esc(it.codigo)}</td><td>${esc(it.nombre)}</td><td class="n">${nf(e.cantidad,0)}</td><td class="n">${nf(e.costo_unit_usd,3)}</td></tr>`; }).join('')}</table>
    <h3>Resultado</h3><p>Insumos ${usd(c.ins,2)} · Merma ${usd(c.merma,2)} · Envases ${usd(c.env,2)}<br><b>Granel ${usd(c.granelLt,4)}/lt · Con envase ${usd(c.envLtCosto,4)}/lt</b></p>
    <script>window.print()<\/script></body></html>`);
  w.document.close();
}

VISTAS.stock = async app => {
  setPrint('Stock', () => [['Vista', segTxt('#seg')], ['Búsqueda', V('#q')], ['Filtro', chkd('#neg') ? 'solo negativos' : ''], ['Saldo al', fd(hoy())]]);
  app.innerHTML = `<h1>Stock</h1>
    <div class="alert info small">El stock se calcula así: <b>stock inicial + compras recibidas − lo usado en cada partida ± ajustes manuales</b>. Mientras no se cargue el stock inicial de un insumo, su saldo no es confiable.</div>
    <div class="bar"><div class="seg" id="seg"><button data-t="base">Por materia prima base</button><button data-t="mp">Por código</button><button data-t="envase">Envases</button><button data-t="interno">Fabricación interna</button></div>
    <input class="grow" id="q" placeholder="Buscar…"><label class="small nowrap"><input type="checkbox" id="neg" style="width:auto"> Solo negativos</label>
    ${can('produccion') || can('compras') ? '<button class="btn sec" id="inv">Cargar inventario inicial</button>' : ''}<button class="btn sec" onclick="imprimir()">Imprimir</button></div>
    <div class="card"><div class="tw" id="tabla"></div></div>`;
  const [rows, sbase] = await Promise.all([fetchAll(() => sb.from('v_stock').select('*').order('codigo')), fetchAll(() => sb.from('v_stock_base').select('*').order('nombre'))]);
  let tipo = 'base';

    $$('#seg button', app).forEach(b => b.classList.toggle('on', b.dataset.t === tipo));

    if (tipo === 'base') {
      const f = sbase.filter(r => (!q || (r.nombre + ' ' + r.lista_codigos).toUpperCase().includes(q)) && (!neg || r.stock < 0));
      $('#tabla', app).innerHTML = `<table><thead><tr><th>Materia prima</th><th class="hm">Códigos</th><th class="n">Stock</th><th>Unid</th><th>Estado</th></tr></thead><tbody>${
        f.map(r => `<tr class="click" data-b="${r.mp_base_id}"><td><b>${esc(r.nombre)}</b></td><td class="hm small">${r.codigos > 1 ? `<span class="badge b-info">${r.codigos}</span> ` : ''}${esc(r.lista_codigos)}</td>
          <td class="n" style="${r.stock<0?'color:var(--bad);font-weight:600':''}">${nf(r.stock,2)}</td><td>${esc(r.unidad)}</td>
          <td>${!r.tiene_inicial ? '<span class="badge b-gray">sin inicial</span>' : r.stock < 0 ? '<span class="badge b-bad">negativo</span>' : '<span class="badge b-ok">ok</span>'}</td></tr>`).join('')}</tbody></table><p class="small muted">${f.length} materias primas</p>`;
      $$('tr[data-b]', app).forEach(tr => tr.onclick = () => fichaBase(Number(tr.dataset.b)));
      return;
    }
    const f = rows.filter(r => r.tipo === tipo && (!q || (r.codigo + ' ' + r.nombre).toUpperCase().includes(q)) && (!neg || r.stock < 0));
    $('#tabla', app).innerHTML = `<table><thead><tr><th>Código</th><th>Nombre</th><th class="n">Stock</th><th>Unid</th><th class="n">Valor U$S</th><th>Estado</th><th>Último mov.</th></tr></thead><tbody>${
      f.map(r => { const v = S.val[r.item_id]; return `<tr class="click" data-id="${r.item_id}"><td><b>${esc(r.codigo)}</b></td><td>${esc(r.nombre)}</td>

function importarGastosModal(onDone){
  modal(`<h2>Importar gastos de meses anteriores</h2>

      const iM = ix(/^MES|PERIODO|FECHA/), iC = ix(/CONCEPTO/), iI = ix(/IMPORTE|MONTO/), iP = ix(/%|PORC|ASIGN/), iD = ix(/DETALLE|DESCRIP/);

        else { const t = String(m).trim(); let x = t.match(/^(\d{4})[-\/](\d{1,2})/) || null; if (x) per = x[1] + '-' + x[2].padStart(2,'0');
          else { x = t.match(/^(\d{1,2})[-\/](\d{4})$/) || t.match(/^\d{1,2}[-\/](\d{1,2})[-\/](\d{4})$/); if (x) per = (x[2].length === 4 ? x[2] + '-' + x[1].padStart(2,'0') : null); } }
        if (!per) { mal.push(String(m)); continue; }
        const nombre = String(r[iC]).trim().toUpperCase();
        let c = conc.find(x => x.nombre === nombre);
        if (!c) { c = chk(await sb.from('conceptos_gasto').insert({ nombre, usa_porcentaje: iP >= 0, pct_default: 1, orden: 60 }).select().single()); conc.push(c); }
        let pct = iP >= 0 && r[iP] != null ? num(r[iP]) : 1; if (pct > 1) pct = pct / 100;

      }

    });
  });
