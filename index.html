GT.comparar = async el => {
  setPrint('Gastos directos de Fábrica · Comparación de períodos', () => [['Desde', fdi(V('#d'))], ['Hasta', fdi(V('#h'))], ['Valores', segTxt('#ver')]]);
  const d0 = new Date(); d0.setDate(1); d0.setMonth(d0.getMonth() - 11);
  const desde = VISTAS._gDesde || d0.toISOString().slice(0,7), hasta = VISTAS._gHasta || mesActual();
  el.innerHTML = `<div class="bar"><label class="small">Desde</label><input type="month" id="d" value="${desde}" style="max-width:170px"><label class="small">Hasta</label><input type="month" id="h" value="${hasta}" style="max-width:170px">
    <div class="seg" id="ver"><button data-v="asig" class="on">Importes asignados</button><button data-v="lt">$ por litro</button></div>
    <button class="btn sec" id="xls">Excel</button><button class="btn sec" onclick="imprimir()">Imprimir</button></div>
    <div id="out"></div>`;
  const [conc, G, T] = await Promise.all([conceptosGasto(),
    fetchAll(() => sb.from('gastos_fabrica').select('periodo,concepto_id,importe_ars,importe_asignado_ars').gte('periodo', desde + '-01').lte('periodo', hasta + '-01')),
    fetchAll(() => sb.from('v_gastos_fabrica_mes').select('*').gte('periodo', desde + '-01').lte('periodo', hasta + '-01').order('periodo')) ]);
  const meses = []; for (let d = new Date(desde + '-15'); d.toISOString().slice(0,7) <= hasta; d.setMonth(d.getMonth() + 1)) meses.push(d.toISOString().slice(0,7) + '-01');
  const cmap = Object.fromEntries(conc.map(c => [c.id, c])), tmap = Object.fromEntries(T.map(t => [t.periodo, t]));
  const usados = [...new Set(G.map(g => g.concepto_id))].sort((a, b) => (cmap[a]?.orden ?? 999) - (cmap[b]?.orden ?? 999));
  const val = {}; G.forEach(g => { const k = g.concepto_id + '|' + g.periodo; val[k] = (val[k] || 0) + Number(g.importe_asignado_ars); });
  let ver = 'asig';
  const draw = () => {
    $$('#ver button', el).forEach(b => b.classList.toggle('on', b.dataset.v === ver));
    const cel = (c, p) => { const v = val[c + '|' + p]; if (!v) return ''; if (ver === 'asig') return nf(v, 0); const l = tmap[p]?.litros; return l > 0 ? nf(v / l, 2) : '—'; };
    const nm = p => new Date(p + 'T12:00').toLocaleDateString('es-AR', { month:'short', year:'2-digit' });
    $('#out', el).innerHTML = usados.length ? `<div class="card"><div class="chartbox"><canvas id="ch"></canvas></div></div>
      <div class="card"><div class="tw"><table><thead><tr><th>Concepto</th>${meses.map(p => `<th class="n">${nm(p)}</th>`).join('')}</tr></thead><tbody>
      ${usados.map(c => `<tr><td class="nowrap"><b>${esc(cmap[c]?.nombre)}</b></td>${meses.map(p => `<td class="n">${cel(c, p)}</td>`).join('')}</tr>`).join('')}
      <tr><td><b>TOTAL ASIGNADO $</b></td>${meses.map(p => `<td class="n"><b>${tmap[p] ? nf(tmap[p].asignado_ars, 0) : ''}</b></td>`).join('')}</tr>
      <tr><td>Litros fabricados</td>${meses.map(p => `<td class="n">${tmap[p] ? nf(tmap[p].litros, 0) : ''}</td>`).join('')}</tr>
      <tr><td><b>$ por litro</b></td>${meses.map(p => `<td class="n"><b>${tmap[p]?.ars_lt ? nf(tmap[p].ars_lt, 2) : ''}</b></td>`).join('')}</tr>
      <tr><td>U$S por litro</td>${meses.map(p => `<td class="n">${tmap[p]?.usd_lt ? nf(tmap[p].usd_lt, 4) : ''}</td>`).join('')}</tr>
      </tbody></table></div><p class="small muted">${ver === 'asig' ? 'Importes asignados a fábrica, en pesos de cada mes.' : 'Cada concepto dividido por los litros fabricados en el mes.'}</p></div>`
      : '<p class="muted">No hay gastos cargados en este período. Podés cargarlos mes a mes o importarlos desde un Excel en "Carga del mes".</p>';
    if (!usados.length) return;
    const colores = ['#6b2fd6','#9b5de5','#f5c518','#e07a5f','#1f9d55','#3d5a80','#c44fd0','#888'];
    new Chart($('#ch', el), { type:'bar', data:{ labels: meses.map(nm), datasets: usados.map((c, i) => ({ label: cmap[c]?.nombre, backgroundColor: colores[i % colores.length],
      data: meses.map(p => { const v = val[c + '|' + p] || 0; if (ver === 'asig') return v; const l = tmap[p]?.litros; return l > 0 ? v / l : 0; }) })) },
      options:{ maintainAspectRatio:false, scales:{ x:{ stacked:true }, y:{ stacked:true, ticks:{ callback: v => nf(v, ver === 'asig' ? 0 : 2) } } } } });
  };
  $$('#ver button', el).forEach(b => b.onclick = () => { ver = b.dataset.v; draw(); });
  $('#d', el).onchange = e => { VISTAS._gDesde = e.target.value; GT.comparar(el); };
  $('#h', el).onchange = e => { VISTAS._gHasta = e.target.value; GT.comparar(el); };
  $('#xls', el).onclick = () => descargarXLSX('Gastos_directos_fabrica_' + desde + '_a_' + hasta, { 'Comparación': usados.map(c => ({ Concepto: cmap[c]?.nombre, ...Object.fromEntries(meses.map(p => [p.slice(0,7), val[c + '|' + p] || 0])) }))
    .concat([{ Concepto: 'TOTAL ASIGNADO', ...Object.fromEntries(meses.map(p => [p.slice(0,7), tmap[p]?.asignado_ars || 0])) },
             { Concepto: 'LITROS', ...Object.fromEntries(meses.map(p => [p.slice(0,7), tmap[p]?.litros || 0])) },
             { Concepto: '$ POR LITRO', ...Object.fromEntries(meses.map(p => [p.slice(0,7), tmap[p]?.ars_lt || null])) }]) });
  draw();
};

async function excelProduccionMes(mes){ const [y, m] = mes.split('-').map(Number); return excelProduccion(mes + '-01', new Date(y, m, 1).toISOString().slice(0,10), nomMesLargo(mes + '-01'), mes); }
async function excelProduccion(desde, hastaExcl, titulo, sufijo){
  toast('Armando el Excel…');
  const parts = await fetchAll(() => sb.from('v_partidas_full').select('*').gte('fecha', desde).lt('fecha', hastaExcl).order('nro'));
  if (!parts.length) throw new Error('No hay partidas en el período');
  const mes = desde.slice(0,7), unMes = desde.slice(8) === '01' && desde.slice(0,7) === new Date(new Date(hastaExcl + 'T12:00').setDate(0)).toISOString().slice(0,7) && hastaExcl.slice(8) === '01';
  const ids = parts.map(p => p.id);
  let ins = [], env = [];
  for (let i = 0; i < ids.length; i += 150) {
    const sub = ids.slice(i, i + 150);
    ins = ins.concat(await fetchAll(() => sb.from('partida_insumos').select('*').in('partida_id', sub).order('orden')));
    env = env.concat(await fetchAll(() => sb.from('partida_envases').select('*').in('partida_id', sub)));
  }
  const I = id => S.itemById[id] || { codigo:'?', nombre:'?', unidad:'' };
  const r = (v, d=4) => v == null || isNaN(v) ? null : Math.round(Number(v) * 10**d) / 10**d;
  const nombreMes = String(titulo).toUpperCase();
  const wb = XLSX.utils.book_new();
  const hoja = (aoa, cols, nombre) => { const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = cols.map(w => ({ wch: w })); XLSX.utils.book_append_sheet(wb, ws, nombre.slice(0,31)); };

  // ---- Resumen
  const R = [[`ÜXELL — PARTIDAS FABRICADAS ${nombreMes}`], [`Generado el ${fd(hoy())} · costos en U$S y en pesos al dólar de cada partida`], [],
    ['Nº partida','Fecha','Lote','Código','Producto','Tipo','Cant. teórica','Litros producidos','Rendimiento %','Insumos U$S','Merma U$S','Energía + accesorios U$S','Envases U$S','Costo total U$S',
     '① Granel U$S/lt','② Con envase U$S/lt','③ Con gastos directos de fábrica U$S/lt','Dólar','① Granel $/lt','② Con envase $/lt','Estado','Observaciones']];
  const tot = { teor:0, lt:0, ins:0, merma:0, extra:0, env:0 };
  parts.forEach(p => {
    const extra = Number(p.energia_usd||0) + Number(p.accesorios_usd||0);
    const total = Number(p.costo_insumos_usd||0) + Number(p.costo_merma_usd||0) + extra + Number(p.costo_envases_usd||0);
    tot.teor += Number(p.cant_teorica||0); tot.lt += Number(p.litros_producidos||0); tot.ins += Number(p.costo_insumos_usd||0);
    tot.merma += Number(p.costo_merma_usd||0); tot.extra += extra; tot.env += Number(p.costo_envases_usd||0);
    R.push([p.nro, p.fecha, p.lote || '', p.producto_codigo, p.producto_nombre, p.producto_tipo === 'interno' ? 'Uso interno' : 'Producto',
      r(p.cant_teorica,2), r(p.litros_producidos,2), p.cant_teorica ? r(p.litros_producidos / p.cant_teorica * 100, 1) : null,
      r(p.costo_insumos_usd,2), r(p.costo_merma_usd,2), r(extra,2), r(p.costo_envases_usd,2), r(total,2),
      r(p.costo_granel_lt_usd), r(p.costo_envasado_lt_usd), r(p.costo_total_lt_usd), r(p.cotizacion,2),
      p.cotizacion ? r(p.costo_granel_lt_usd * p.cotizacion, 2) : null, p.cotizacion && p.costo_envasado_lt_usd ? r(p.costo_envasado_lt_usd * p.cotizacion, 2) : null,
      p.estado === 'cerrada' ? 'Cerrada' : 'Borrador',
      [p.litros_estimados ? 'Sin litros reales en la planilla (se usó la teórica)' : '', p.litros_perdidos > 0 ? `Pérdida ${p.litros_perdidos} lt: ${p.motivo_perdida||''}` : '', p.origen === 'historica' ? 'Sin detalle de insumos' : ''].filter(Boolean).join(' · ')]);
  });
  R.push([], ['TOTAL DEL MES','','','','','', r(tot.teor,2), r(tot.lt,2), tot.teor ? r(tot.lt/tot.teor*100,1) : null, r(tot.ins,2), r(tot.merma,2), r(tot.extra,2), r(tot.env,2), r(tot.ins+tot.merma+tot.extra+tot.env,2)]);
  hoja(R, [9,11,10,9,34,11,11,12,10,12,10,12,11,12,12,12,14,9,12,12,9,40], 'Resumen');

  // ---- Consumo de materias primas del mes
  const cons = {};
  ins.forEach(l => { const k = l.insumo_id; cons[k] = cons[k] || { q:0, usd:0, n:0 }; cons[k].q += Number(l.cantidad); cons[k].usd += Number(l.cantidad) * Number(l.costo_unit_usd); cons[k].n++; });
  const C = [[`ÜXELL — CONSUMO DE MATERIAS PRIMAS ${nombreMes}`], [], ['Código','Materia prima','Unidad','Cantidad usada','Costo U$S','Costo promedio U$S/unid','Partidas en que se usó']];
  Object.entries(cons).sort((a,b) => b[1].usd - a[1].usd).forEach(([k, c]) => C.push([I(k).codigo, I(k).nombre, I(k).unidad, r(c.q,3), r(c.usd,2), c.q ? r(c.usd/c.q) : null, c.n]));
  hoja(C, [10,40,8,14,12,16,12], 'Consumo MP');

  // ---- Una solapa por partida (como la planilla de Romina)
  parts.forEach(p => {
    const L = ins.filter(l => l.partida_id === p.id), E = env.filter(e => e.partida_id === p.id);
    const extra = Number(p.energia_usd||0) + Number(p.accesorios_usd||0);
    const A = [
      ['Nº PARTIDA', p.nro, '', 'FECHA', p.fecha, '', 'LOTE', p.lote || ''],
      ['CÓDIGO', p.producto_codigo, '', 'PRODUCTO', p.producto_nombre],
      ['CANT. TEÓRICA', r(p.cant_teorica,2), '', 'LITROS PRODUCIDOS', r(p.litros_producidos,2), '', 'DÓLAR', r(p.cotizacion,2)],
      [],
      ['CÓDIGO','INSUMO','UNIDAD','CANT. RECETA','CANT. REAL','DESVÍO %','U$S / UNID','SUBTOTAL U$S','FECHA PRECIO']];
    L.forEach(l => A.push([I(l.insumo_id).codigo, I(l.insumo_id).nombre, I(l.insumo_id).unidad, r(l.cantidad_receta,3), r(l.cantidad,3),
      l.cantidad_receta ? r((l.cantidad / l.cantidad_receta - 1) * 100, 1) : null, r(l.costo_unit_usd), r(l.cantidad * l.costo_unit_usd, 2), l.fecha_valuacion || '']));
    if (!L.length) A.push(['', p.origen === 'historica' ? '(partida histórica: la planilla no tenía el detalle de insumos)' : '(sin insumos cargados)']);
    A.push([], ['', 'COSTO INSUMOS', '', '', '', '', '', r(p.costo_insumos_usd,2)],
      ['', `MERMA POR ENVASADO (${r(p.merma_pct*100,2)}%)`, '', '', '', '', '', r(p.costo_merma_usd,2)]);
    if (extra) A.push(['', 'ENERGÍA Y ACCESORIOS', '', '', '', '', '', r(extra,2)]);
    A.push([], ['CÓDIGO','ENVASE','CANTIDAD','LITROS','U$S / ENVASE','SUBTOTAL U$S','COSTO ENVASE LLENO U$S']);
    E.forEach(e => { const it = I(e.envase_id), lts = Number(it.litros_envase||0);
      A.push([it.codigo, it.nombre, r(e.cantidad,0), r(lts * e.cantidad,2), r(e.costo_unit_usd), r(e.cantidad * e.costo_unit_usd,2), p.costo_granel_lt_usd ? r(p.costo_granel_lt_usd * lts + Number(e.costo_unit_usd)) : null]); });
    if (!E.length) A.push(['', '(sin envasar: uso interno o granel)']);
    A.push([], ['', 'COSTO ENVASES', '', '', '', r(p.costo_envases_usd,2)], [],
      ['RESULTADO', '', '', 'U$S / LT', '$ / LT'],
      ['', '① Costo granel', '', r(p.costo_granel_lt_usd), p.cotizacion ? r(p.costo_granel_lt_usd * p.cotizacion, 2) : null],
      ['', '② Costo con envase', '', r(p.costo_envasado_lt_usd), p.cotizacion && p.costo_envasado_lt_usd ? r(p.costo_envasado_lt_usd * p.cotizacion, 2) : null],
      ['', '③ Con gastos directos de fábrica', '', r(p.costo_total_lt_usd), p.cotizacion && p.costo_total_lt_usd ? r(p.costo_total_lt_usd * p.cotizacion, 2) : null]);
    if (p.horas_hombre) A.push(['', `Horas hombre: ${p.horas_hombre}`]);
    if (p.nota) A.push([], ['NOTA', p.nota]);
    hoja(A, [11,38,10,13,13,10,12,13,13], String(p.nro));
  });

  // ---- Gastos directos de fábrica del mes
  const [gf, cg, gt] = await Promise.all([sb.from('gastos_fabrica').select('*').eq('periodo', mes + '-01').order('id'), conceptosGasto(), sb.from('v_gastos_fabrica_mes').select('*').eq('periodo', mes + '-01').maybeSingle()]);
  const GF = chk(gf), cm = Object.fromEntries(cg.map(c => [c.id, c.nombre]));
  if (GF.length && unMes) {
    const Gs = [[`ÜXELL — GASTOS DIRECTOS DE FÁBRICA ${nombreMes}`], [], ['Concepto','Detalle','Comprobante','Importe total $','% fábrica','Asignado $']];
    GF.forEach(g => Gs.push([cm[g.concepto_id], g.detalle || '', g.comprobante || '', r(g.importe_ars,2), r(g.pct_asignacion*100,2), r(g.importe_asignado_ars,2)]));
    const T = gt.data;
    if (T) Gs.push([], ['TOTAL ASIGNADO', '', '', r(T.total_ars,2), '', r(T.asignado_ars,2)], ['Litros fabricados', '', '', '', '', r(T.litros,0)], ['$ por litro', '', '', '', '', r(T.ars_lt,2)], ['U$S por litro', '', '', '', '', r(T.usd_lt,4)]);
    hoja(Gs, [30,34,16,16,10,16], 'Gastos de Fábrica');
  }

  // ---- Detalle plano (para filtrar)
  const D = [['Nº partida','Fecha','Producto','Código insumo','Insumo','Unidad','Cant. receta','Cant. real','U$S/unid','Subtotal U$S']];
  ins.forEach(l => { const p = parts.find(x => x.id === l.partida_id);
    D.push([p.nro, p.fecha, `${p.producto_codigo} ${p.producto_nombre}`, I(l.insumo_id).codigo, I(l.insumo_id).nombre, I(l.insumo_id).unidad, r(l.cantidad_receta,3), r(l.cantidad,3), r(l.costo_unit_usd), r(l.cantidad * l.costo_unit_usd, 2)]); });
  hoja(D, [10,11,36,12,38,8,12,12,10,12], 'Detalle insumos');

  XLSX.writeFile(wb, `Uxell_Partidas_fabricadas_${sufijo}.xlsx`);
}

function descargarXLSX(nombre, hojas, opc = {}){
  const wb = XLSX.utils.book_new();
  const f = filtrosLista();
  Object.entries(hojas).forEach(([n, rows]) => {
    let ws;
    if (opc.sinEncabezado) ws = XLSX.utils.json_to_sheet(rows);
    else {
      ws = XLSX.utils.aoa_to_sheet([[`ÜXELL PINTURAS — ${PRINT.titulo}`], [`Emitido el ${fd(hoy())} · Dólar BNA ${S.dolar ? nf(S.dolar,2) : '—'}`],
        [f.length ? 'Filtros: ' + f.map(([k, v]) => `${k}: ${v}`).join(' · ') : 'Sin filtros'], []]);
      XLSX.utils.sheet_add_json(ws, rows, { origin: 'A5' });
      const cols = Object.keys(rows[0] || {}); ws['!cols'] = cols.map(c => ({ wch: Math.max(10, Math.min(45, c.length + 4)) }));
    }
    XLSX.utils.book_append_sheet(wb, ws, n.slice(0,31));
  });
  XLSX.writeFile(wb, nombre + '.xlsx');
}

async function leerExcel(file){
  const buf = await file.arrayBuffer();
  return XLSX.read(buf, { type:'array', cellDates:true });
}

async function descargarModeloPrecios(){
  const pv = await fetchAll(() => sb.from('precios_venta').select('producto_id,periodo,precio_lt_ars').order('periodo', { ascending:false }));
  const ult = {}; pv.forEach(x => { if (!(x.producto_id in ult)) ult[x.producto_id] = x; });
  const prods = S.items.filter(i => ['producto','interno'].includes(i.tipo) && i.activo).sort((a, b) => a.codigo.localeCompare(b.codigo, 'es', { numeric:true }));
  const aoa = [['Código','Producto','Tipo','Precio por litro ($)','Último precio cargado','Mes del último precio']];
  prods.forEach(i => aoa.push([i.codigo, i.nombre, i.tipo === 'interno' ? 'Uso interno' : 'Producto', ult[i.id] ? Number(ult[i.id].precio_lt_ars) : null, ult[i.id] ? Number(ult[i.id].precio_lt_ars) : null, ult[i.id] ? ult[i.id].periodo.slice(0,7) : '']));
  const wb = XLSX.utils.book_new(), ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [{wch:12},{wch:44},{wch:12},{wch:20},{wch:20},{wch:18}];

}
async function importarPreciosVenta(file, mes, out){
  if (!file) return;
  const wb = await leerExcel(file);
  const rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header:1, raw:true });
  const hdr = rows.findIndex(r => r.some(c => /COD/i.test(String(c||''))));
  const h = rows[hdr] || [];
  const ic = h.findIndex(c => /COD/i.test(String(c||'')));
  let ip = h.findIndex(c => /PRECIO POR LITRO/i.test(String(c||''))); if (ip < 0) ip = h.findIndex(c => /PRECIO|LISTA|VTA|VENTA/i.test(String(c||'')));
  if (ic < 0 || ip < 0) throw new Error('No encontré las columnas "código" y "precio" en la primera hoja');
  const ok = [], mal = [];
  rows.slice(hdr + 1).forEach(r => { const c = r[ic], p = num(r[ip]); if (c == null || p == null) return;
    const it = S.items.find(i => norm(i.codigo) === norm(c) || (i.alias||'').split(',').some(a => norm(a) === norm(c)));
    if (it && ['producto','interno'].includes(it.tipo)) ok.push({ periodo: mes + '-01', producto_id: it.id, precio_lt_ars: p }); else mal.push(c); });
  const dedup = Object.values(Object.fromEntries(ok.map(o => [o.producto_id, o])));
  for (let i = 0; i < dedup.length; i += 500) chk(await sb.from('precios_venta').upsert(dedup.slice(i, i+500), { onConflict:'periodo,producto_id' }));
  out.innerHTML = `<div class="alert info">${dedup.length} precios cargados para ${mes}.${mal.length ? ` No se encontraron ${mal.length} códigos: ${mal.slice(0,20).map(esc).join(', ')}${mal.length>20?'…':''}` : ''}</div>`;
}

// ---- Importador de planillas mensuales (misma lógica que la carga inicial)
async function importarPartidasXLSX(file, out){
  if (!file) return;
  out.innerHTML = '<p class="muted">Leyendo…</p>';
  const wb = await leerExcel(file);
  const T = v => v == null ? '' : String(v).replace(/\s+/g, ' ').trim();
  const D = v => v instanceof Date ? new Date(v.getTime() - v.getTimezoneOffset()*60000).toISOString().slice(0,10) : null;
  const C = v => v == null ? null : (typeof v === 'number' && Number.isInteger(v) ? String(v) : T(v) || null);
  const findItem = (cod, nombre) => {
    const k = norm(cod);
    let it = k && S.items.find(i => norm(i.codigo) === k || (i.alias||'').split(',').some(a => norm(a) === k));
    if (!it && nombre) it = S.items.find(i => i.nombre.toUpperCase() === nombre.toUpperCase());
    return it;
  };
  const resumen = {};
  const rs = wb.SheetNames.find(n => /^resumen/i.test(n.trim()));
  if (rs) XLSX.utils.sheet_to_json(wb.Sheets[rs], { header:1, raw:true }).slice(1).forEach(r => { if (r[0] != null) resumen[String(r[0]).trim()] = r; });
  const existentes = new Map((await fetchAll(() => sb.from('partidas').select('id,nro,origen'))).map(p => [p.nro, p]));
  const log = []; let n = 0, salt = 0, reemp = 0;
  for (const s of wb.SheetNames) {
    if (/^resumen/i.test(s.trim())) continue;
    const rows = XLSX.utils.sheet_to_json(wb.Sheets[s], { header:1, raw:true, defval:null }).slice(0, 80);
    if (!rows[0] || T(rows[0][0]).toUpperCase() !== 'NRO PARTIDA') continue;
    const B = r => T(r && r[1]).toUpperCase();
    const iTot = rows.findIndex(r => B(r).startsWith('COSTO INSUMOS TOTAL'));
    const iMis = rows.findIndex(r => B(r) === 'MISCELANEOS'), iMisT = rows.findIndex(r => B(r).startsWith('COSTO MISCELANEOS'));
    const iEnv = rows.findIndex(r => B(r) === 'ENVASES'), iEnvT = rows.findIndex(r => B(r).startsWith('CANTIDAD REAL ENVASADA'));
    if (iTot < 0) { log.push(`Hoja ${s}: formato no reconocido`); continue; }
    const h2 = rows[1] || [], h5 = rows[4] || [];
    const nro = num(s.trim()) ? Number(s.trim()) : num(h2[0]);
    if (!nro) { log.push(`Hoja ${s}: sin número`); continue; }
    const ex = existentes.get(nro);
    if (ex && ex.origen !== 'historica') { salt++; continue; }
    if (ex) { chk(await sb.from('partidas').delete().eq('id', ex.id)); reemp++; }  // la histórica (solo resumen) se reemplaza por el detalle completo
    const res = resumen[String(nro)];
    const okF = x => x && x >= '2020-01-01' && x <= hoy();
    const fecha = [D(h2[6]), res && D(res[1]), res && D(res[5])].find(okF);
    if (!fecha) { log.push(`Partida ${nro}: sin fecha`); continue; }
    let prod = findItem(C(h5[0]), T(h5[1]));
    if (!prod) { prod = chk(await sb.from('items').insert({ codigo: C(h5[0]) || ('S/C ' + nro), nombre: T(h5[1]) || 'Sin nombre', tipo:'producto', unidad:'LT' }).select().single()); S.items.push(prod); S.itemById[prod.id] = prod; log.push(`Producto nuevo: ${prod.codigo} ${prod.nombre}`); }
    let merma = 0.02, extras = 0, notaEx = [];
    if (iMis >= 0 && iMisT > iMis) rows.slice(iMis+1, iMisT).forEach(r => { if (B(r) === 'MERMA') { const m = num(r[2]); merma = m != null ? Math.abs(m) : 0.02; } else { const f = num(r[5]) || (num(r[4])||0)*(num(r[2])||0); if (f) { extras += f; notaEx.push(T(r[1]) || T(r[0])); } } });
    const teor = num(h5[2]); let litros = num(h2[2]), est = false; if (!litros || litros <= 0) { litros = teor; est = true; }
    const p = chk(await sb.from('partidas').insert({ nro, fecha, fecha_envasado: res ? D(res[5]) : null, lote: C(h5[6]), producto_id: prod.id, cant_teorica: teor,
      litros_producidos: litros, litros_estimados: est, merma_pct: merma, accesorios_usd: Math.round(extras*100)/100, cotizacion: num(h5[3]),
      estado:'borrador', origen:'importada', costo_excel_lt_usd: num(h2[5]), nota: `Importada de ${file.name}` + (notaEx.length ? '; otros: ' + notaEx.join(', ') : '') }).select('id').single());
    const li = [];
    for (const [o, r] of rows.slice(7, iTot).entries()) {
      const cant = num(r[2]); if (!cant) continue; const cod = C(r[0]), nom = T(r[1]); if (!cod && !nom) continue;
      let it = findItem(cod, nom);
      if (!it) { it = chk(await sb.from('items').insert({ codigo: cod || ('SC-' + nom.slice(0,20)), nombre: nom || cod, tipo:'mp', unidad: T(r[3]).toUpperCase() || 'KG' }).select().single()); S.items.push(it); S.itemById[it.id] = it; log.push(`Insumo nuevo: ${it.codigo} ${it.nombre}`); }
      li.push({ partida_id: p.id, insumo_id: it.id, cantidad: cant, costo_unit_usd: num(r[4]) || 0, fecha_valuacion: fecha, origen_valuacion:'planilla', orden: o });
    }
    if (li.length) chk(await sb.from('partida_insumos').insert(li));
    const le = [];
    if (iEnv >= 0 && iEnvT > iEnv) for (const r of rows.slice(iEnv+1, iEnvT)) {
      const c = num(r[2]); if (!c || c <= 0) continue;
      let cod = C(r[0]) || '', desc = T(r[1]);
      let it = findItem(cod);
      if (!it && /^HOJALATA$|^HL$/i.test(cod)) { const l = ({'1/8 LTS':.125,'1/4 LTS':.25,'1/2 LTS':.5})[desc.toUpperCase()] ?? num(desc.replace(/LTS?/i,'')); it = S.items.find(i => i.tipo==='envase' && /^HL\s/i.test(i.codigo) && !/CAT|ESP/i.test(i.codigo) && Number(i.litros_envase) === l); }
      if (!it) { log.push(`Partida ${nro}: envase "${cod} ${desc}" no encontrado (no se cargó)`); continue; }
      le.push({ partida_id: p.id, envase_id: it.id, cantidad: c, costo_unit_usd: num(r[4]) || 0 });
    }
    if (le.length) chk(await sb.from('partida_envases').insert(le));
    chk(await sb.rpc('finalizar_importada', { p_id: p.id }));
    n++; out.innerHTML = `<p class="muted">Importando… ${n} partidas</p>`;
  }
  let rel = 0; try { rel = chk(await sb.rpc('generar_relevamiento')); } catch (e) { log.push('No se pudo generar el relevamiento de precios: ' + e.message); }
  await recargarVal();
  out.innerHTML = `<div class="alert info">Listo: ${n} partidas importadas con su detalle${reemp ? ` (${reemp} reemplazaron a partidas que solo tenían el resumen)` : ''}${salt ? `, ${salt} ya estaban completas y no se tocaron` : ''}. ${rel ? `Se agregaron ${rel} precios al relevamiento mensual.` : ''}</div>${log.length ? `<details><summary>Avisos (${log.length})</summary><ul class="small">${log.map(l => `<li>${esc(l)}</li>`).join('')}</ul></details>` : ''}`;
}


// ---- Carga inicial desde el archivo generado a partir de las planillas
async function cargaInicial(file, out){
  if (!file) return;
  const J = JSON.parse(await file.text());
  const paso = t => { out.innerHTML = `<p><b>${t}</b></p><p class="small muted">No cierres esta página.</p>`; };
  const lotes = async (tabla, filas, sel, tam=500) => { let res = [];
    for (let i = 0; i < filas.length; i += tam) {
      const q = sb.from(tabla).insert(filas.slice(i, i + tam));
      const r = chk(sel ? await q.select(sel) : await q); if (sel) res = res.concat(r);
      paso(`${tabla}: ${Math.min(i + tam, filas.length)} / ${filas.length}`);
    } return res; };
  if ((await sb.from('items').select('id', { count:'exact', head:true })).count) throw new Error('La base ya tiene datos: la carga inicial solo se hace una vez.');
  paso('Cotizaciones…');
  for (let i = 0; i < J.cotizaciones.length; i += 500) chk(await sb.from('cotizaciones').upsert(J.cotizaciones.slice(i, i+500).map(([fecha, valor]) => ({ fecha, valor, fuente:'Planillas Uxell' }))));
  const prov = Object.fromEntries((await lotes('proveedores', J.proveedores.map(nombre => ({ nombre })), 'id,nombre')).map(p => [p.nombre, p.id]));
  const it = Object.fromEntries((await lotes('items', J.items, 'id,codigo')).map(i => [i.codigo, i.id]));
  await lotes('valuaciones', J.valuaciones.map(([c, fecha, costo_usd, cotizacion, nota]) => ({ item_id: it[c], fecha, costo_usd, cotizacion, origen:'importacion', nota })));
  await lotes('recetas', J.recetas.map(([c, cant_teorica, merma_pct, notas]) => ({ producto_id: it[c], cant_teorica, merma_pct, notas })));
  await lotes('receta_lineas', J.recetas.flatMap(([c,,,, ls]) => ls.map(([ins, cantidad], orden) => ({ producto_id: it[c], insumo_id: it[ins], cantidad, orden }))), null, 1000);
  await lotes('compras', J.compras.map(({ item, prov: p, ...c }) => ({ ...c, item_id: it[item], proveedor_id: p ? prov[p] : null, origen:'importacion' })));
  const parts = J.partidas.map(({ prod, ins, env, ...p }) => ({ ...p, producto_id: it[prod], estado:'borrador' }));
  const pid = Object.fromEntries((await lotes('partidas', parts, 'id,nro')).map(p => [p.nro, p.id]));
  await lotes('partida_insumos', J.partidas.flatMap(p => p.ins.map(([c, cantidad, costo_unit_usd, orden]) => ({ partida_id: pid[p.nro], insumo_id: it[c], cantidad, costo_unit_usd, fecha_valuacion: p.fecha, origen_valuacion:'planilla', orden }))), null, 1000);
  await lotes('partida_envases', J.partidas.flatMap(p => p.env.map(([c, cantidad, costo_unit_usd]) => ({ partida_id: pid[p.nro], envase_id: it[c], cantidad, costo_unit_usd }))), null, 1000);
  let r;
  do { r = chk(await sb.rpc('finalizar_carga_inicial', { p_lote: 250 })); paso(`Calculando costos de las partidas… faltan ${r.quedan}`); } while (r.quedan > 0);
  await cargarBase();
  out.innerHTML = `<div class="alert info">Carga inicial terminada: ${J.items.length} items, ${J.recetas.length} recetas, ${J.compras.length} compras y ${J.partidas.length} partidas.</div>`;
  toast('Carga inicial terminada');
}


async function listarCopias(el){

  if (error) { el.innerHTML = `<p class="small" style="color:var(--bad)">No se pudieron leer las copias: ${esc(error.message)}</p>`; return; }

  if (!L.length) { el.innerHTML = '<p class="muted small">Todavía no hay copias guardadas.</p>'; return; }
  const urls = (await sb.storage.from('copias').createSignedUrls(L.map(f => f.name), 3600, { download: true })).data || [];
  const lindo = n => { const m = n.match(/copia_(\d{4})-(\d{2})-(\d{2})_(\d{2})(\d{2})(_auto)?/); return m ? `${m[3]}/${m[2]}/${m[1]} ${m[4]}:${m[5]} hs · ${m[6] ? 'automática' : 'manual'}` : n; };
  el.innerHTML = `<table><thead><tr><th>Copia</th><th class="n">Tamaño</th><th></th></tr></thead><tbody>${L.map((f, i) => `<tr><td>${lindo(f.name)}</td>
    <td class="n">${nf((f.metadata?.size || 0) / 1048576, 1)} MB</td><td class="right">${urls[i]?.signedUrl ? `<a class="btn sec sm" href="${urls[i].signedUrl}">Descargar</a>` : ''}</td></tr>`).join('')}</tbody></table>
    <p class="small muted">El archivo descargado (.json.gz) contiene todas las tablas. Si algún día hace falta restaurar, pasáselo a Claude.</p>`;
}

async function respaldo(){
  toast('Preparando respaldo…');
  const tablas = ['mp_base','items','proveedores','cotizaciones','compras','valuaciones','recetas','receta_lineas','partidas','partida_insumos','partida_envases','movimientos_stock','gastos_mes','conceptos_gasto','gastos_fabrica','precios_venta'];
  const hojas = {};
  for (const t of tablas) hojas[t] = await fetchAll(() => sb.from(t).select('*'));
  descargarXLSX('Respaldo_Uxell_Costos_' + hoy(), hojas, { sinEncabezado: true });
}

// =====================================================================
//  LOGIN
// =====================================================================
function pantallaLogin(msg){
  $('#nav').classList.add('hidden'); $('#hdrUser').classList.add('hidden'); $('#hdrDolar').classList.add('hidden');
  $('#app').innerHTML = `<div class="login card"><div style="background:#000;border-radius:12px;padding:14px;text-align:center;margin-bottom:12px"><img src="logo.png" alt="Üxell Pinturas" style="height:90px"></div><h1>Uxell Costos · Ingresar</h1>${msg ? `<div class="alert">${msg}</div>` : ''}
    <label class="f">Email</label><input type="email" id="em" autocomplete="username">
    <label class="f" style="margin-top:8px">Contraseña</label><input type="password" id="pw" autocomplete="current-password">
    <div class="row" style="margin-top:12px"><button class="btn" id="in">Ingresar</button><button class="btn sec" id="reg">Crear cuenta</button></div>
    <p class="small"><a href="#" id="olv">Olvidé mi contraseña</a></p></div>`;
  const em = () => $('#em').value.trim(), pw = () => $('#pw').value;
  $('#in').onclick = () => guard(async () => { chk(await sb.auth.signInWithPassword({ email: em(), password: pw() })); await iniciar(); });
  $('#pw').onkeydown = e => { if (e.key === 'Enter') $('#in').click(); };
  $('#reg').onclick = () => guard(async () => { if (pw().length < 8) throw new Error('La contraseña debe tener al menos 8 caracteres');
    const r = chk(await sb.auth.signUp({ email: em(), password: pw() }));
    if (r.session) await iniciar(); else pantallaLogin('Te mandamos un mail para confirmar la cuenta. Después ingresá y pedí a un administrador que te dé permisos.'); });
  $('#olv').onclick = e => { e.preventDefault(); guard(async () => { chk(await sb.auth.resetPasswordForEmail(em(), { redirectTo: location.origin + location.pathname })); toast('Te mandamos un mail para cambiar la contraseña'); }); };
}

async function iniciar(){
  const { data: { session } } = await sb.auth.getSession();
  if (!session) return pantallaLogin();
  S.user = session.user;
  const p = await sb.from('perfiles').select('*').eq('id', S.user.id).maybeSingle();
  S.perfil = p.data;
  if (!S.perfil || !S.perfil.activo) return pantallaLogin('Tu usuario todavía no está habilitado. Pedile a un administrador que te active.');
  const u = $('#hdrUser'); u.classList.remove('hidden'); u.textContent = S.perfil.nombre || S.user.email; u.onclick = () => location.hash = 'config';
  $('#nav').classList.remove('hidden');
  await cargarBase();
  router();
}

sb.auth.onAuthStateChange((ev) => { if (ev === 'PASSWORD_RECOVERY') {
  modal(`<h2>Nueva contraseña</h2><input type="password" id="np"><div class="mfoot"><button class="btn" id="ok">Guardar</button></div>`, (el, close) => {
    $('#ok', el).onclick = () => guard(async () => { chk(await sb.auth.updateUser({ password: $('#np', el).value })); close(); toast('Contraseña actualizada'); }); });
}});
if (SUPABASE_URL.includes('TU-PROYECTO')) $('#app').innerHTML = '<div class="login card"><h1>Falta configurar</h1><p>Completá SUPABASE_URL y SUPABASE_ANON_KEY al principio del archivo.</p></div>';
else iniciar();
</script>
